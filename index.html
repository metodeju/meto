function applyEnvironment(cfg, Q) {
    const night = cfg.time === 'night', dusk = cfg.time === 'dusk', rain = cfg.weather === 'rain';
    const sky = new THREE.Color(night ? 0x050a18 : dusk ? 0xf08a5d : 0x87ceeb);
    let amb = night ? 0.22 : dusk ? 0.42 : 0.65, dir = night ? 0.12 : dusk ? 0.5 : 0.85;
    let ambC = night ? 0x7a88c8 : dusk ? 0xffd2b0 : 0xffffff, dirC = night ? 0x8fa0ff : dusk ? 0xffa066 : 0xffffff;
    let far = Q.far;
    if (rain) { sky.lerp(new THREE.Color(night ? 0x0a0d14 : 0x74808a), night ? 0.5 : 0.72); dir *= 0.45; amb *= 0.92; far *= 0.6; }
    scene.background.copy(sky);
    scene.fog.color.copy(sky); scene.fog.near = rain ? 40 : 200; scene.fog.far = far;
    ambLight.color.setHex(ambC); ambLight.intensity = amb;
    dirLight.color.setHex(dirC); dirLight.intensity = dir;
    cloudMat.color.setHex(night ? 0x1a2030 : (rain ? 0x7d858f : (dusk ? 0xffc9a8 : 0xffffff)));
    lampMat.color.setHex(night ? 0xfff2b0 : dusk ? 0xffd890 : 0x8a8f99);
    if (matRoad) { matRoad.roughness = rain ? 0.22 : 0.7; matRoad.color.setHex(rain ? 0x8a8f99 : 0xffffff); }
    if (matGround) matGround.color.setHex(rain ? 0xb4c4b4 : 0xffffff);
    const lightsOn = night || dusk || rain;
    headlights.forEach(h => { h.visible = lightsOn; h.intensity = night ? 2.4 : (dusk ? 1.3 : 0.8); });
    if (rainMesh) rainMesh.visible = rain;
}

function initRain(Q) {
    if (rainMesh) { disposeObj(rainMesh); rainMesh = null; }
    const n = Q.rain;
    const pos = new Float32Array(n * 6);
    rainBase = [];
    for (let i = 0; i < n; i++) rainBase.push([(Math.random() - 0.5) * 60, Math.random() * 30, (Math.random() - 0.5) * 60]);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    rainMesh = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0xbfd0e0, transparent: true, opacity: 0.45 }));
    rainMesh.frustumCulled = false; rainMesh.visible = false;
    scene.add(rainMesh);
}
function updateRain(dt, camPos, speedFwd) {
    if (!rainMesh || !rainMesh.visible) return;
    const p = rainMesh.geometry.attributes.position.array;
    for (let i = 0; i < rainBase.length; i++) {
        const b = rainBase[i];
        b[1] -= 32 * dt;
        if (b[1] < -4) { b[0] = (Math.random() - 0.5) * 60; b[1] = 26 + Math.random() * 4; b[2] = (Math.random() - 0.5) * 60; }
        const x = camPos.x + b[0], y = camPos.y + b[1] - 4, z = camPos.z + b[2];
        p[i * 6] = x; p[i * 6 + 1] = y; p[i * 6 + 2] = z;
        p[i * 6 + 3] = x; p[i * 6 + 4] = y + 1.3; p[i * 6 + 5] = z;
    }
    rainMesh.geometry.attributes.position.needsUpdate = true;
}

function initLineMesh() {
    if (lineMesh) { disposeObj(lineMesh); lineMesh = null; }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(LINE_W * 2 * 3), 3));
    geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(LINE_W * 2 * 3), 3));
    const idx = [];
    for (let k = 0; k < LINE_W - 1; k++) { const a = k * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    geo.setIndex(idx);
    lineMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.92, depthWrite: false, side: THREE.DoubleSide, ...pOff(-8, -8) }));
    lineMesh.frustumCulled = false; lineMesh.renderOrder = 2;
    scene.add(lineMesh);
}

// speed: aktuální rychlost (m/s); prof: profil rychlosti; vrací nic, plní stuhu
function updateLineMesh(T, line, prof, idx, speed) {
    if (!lineMesh) return;
    const pa = lineMesh.geometry.attributes.position.array, ca = lineMesh.geometry.attributes.color.array;
    const N = T.N, v = Math.max(0, speed);
    const brk = Math.max(3, prof.brkAt(v) * 0.9);
    const hwid = 0.65;
    for (let k = 0; k < LINE_W; k++) {
        const i = (idx - 3 + k + N * 4) % N, ip = (i + 1) % N, im = (i - 1 + N) % N;
        let tx = line.x[ip] - line.x[im], tz = line.z[ip] - line.z[im];
        const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
        const nx = -tz, nz = tx;
        const y = heightAt(T, i, line.off[i]) + 0.1;
        pa[k * 6] = line.x[i] + nx * hwid; pa[k * 6 + 1] = y; pa[k * 6 + 2] = line.z[i] + nz * hwid;
        pa[k * 6 + 3] = line.x[i] - nx * hwid; pa[k * 6 + 4] = y; pa[k * 6 + 5] = line.z[i] - nz * hwid;
        // potřebné zpomalení k dosažení cílové rychlosti v tomto bodě
        const vt = prof.vt[i], d = Math.max((k - 3) * T.ds - 6, 3);
        let r = 0;
        if (v > vt * 1.02) r = ((v * v - vt * vt) / (2 * d)) / brk;
        let R, G, B;
        if (r <= 0) { R = 0.15; G = 0.9; B = 0.3; }
        else if (r < 0.55) { const f = r / 0.55; R = 0.15 + 0.85 * f; G = 0.9 - 0.05 * f; B = 0.3 - 0.2 * f; }
        else { const f = Math.min(1, (r - 0.55) / 0.45); R = 1; G = 0.85 - 0.7 * f; B = 0.1; }
        for (let s = 0; s < 2; s++) { ca[k * 6 + s * 3] = R; ca[k * 6 + s * 3 + 1] = G; ca[k * 6 + s * 3 + 2] = B; }
    }
    lineMesh.geometry.attributes.position.needsUpdate = true;
    lineMesh.geometry.attributes.color.needsUpdate = true;
}

    W = makeWorld(T, { rain: cfg.weather === 'rain', wearMul: cfg.wear });
    rebuildPlayerModel();
}

// pneu nasazené po pit stopu - jen pro tuto jízdu, garážní nastavení se nemění
function applyTireChoice(tireKey) {
    if (!COMPOUNDS[tireKey] || tireKey === tireChoice) { tireChoice = tireKey || tireChoice; return; }
    tireChoice = tireKey;
    const tune = Object.assign({}, getTune(carDef.id), { tire: tireChoice });
    const gp = getProfile(cfg.track, carDef, tune, cfg.weather === 'rain');
    P = gp.P; prof = gp.prof;
}

function cyclePitTire() {
    if (!S || !S.inPit || hubOpen) { if (S && !S.inPit) toast('Pneu lze zvolit jen v boxové uličce', 1200); return; }
    const cur = pit.nextTire || tireChoice;
    const i = TIRE_ORDER.indexOf(cur);
    pit.nextTire = TIRE_ORDER[(i + 1) % TIRE_ORDER.length];
    toast('Při výměně: ' + COMPOUNDS[pit.nextTire].name + ' pneu', 1200);
    updateHudStatic();
}

function resetPlayer(sGrid, lat) {
    S = newCarState(T, sGrid === undefined ? -12 : sGrid, lat === undefined ? 0 : lat);
    S.manual = !!cfg.manual;
    prev.x = S.x; prev.z = S.z; prev.angle = S.angle;
    lapIndex = Math.floor(S.prog / T.L);
    lapStartT = null; lapInvalid = false; secT = [null, null, null]; splitTimes = [null, null, null]; curSec = 0; secStart = 0;
    ghostRec = []; deltaVal = null; pit.active = false; pit.armed = true; pit.nextTire = null;
    camBase = { x: S.x, y: 4, z: S.z + 10 }; camSnap = true;
}

function reloadGhost() {
    ghostData = null; ghostTimeAt = null;
    if (ghostModel) { disposeObj(ghostModel.group); ghostModel = null; }
    if (!store.settings.ghost) return;
    const d = loadGhost(cfg.track, cfg.car);
    if (d && d.length > 60) {
        ghostData = d; computeGhostTimes();
        ghostModel = makeGhost(buildCarModel(carDef, getLook(carDef.id)));
        ghostModel.group.visible = false; scene.add(ghostModel.group);
    }
}

function computeGhostTimes() {
    const n = Math.floor(ghostData.length / 3), N = T.N;
    const tAt = new Float32Array(N).fill(-1);
    let hint = -1;
    for (let k = 0; k < n; k++) {
        const q = locate(T, ghostData[k * 3] / 10, ghostData[k * 3 + 1] / 10, hint, 60);
        hint = q.i;
        if (tAt[q.i] < 0) tAt[q.i] = k / 30;
    }
    if (tAt[0] < 0) tAt[0] = 0;
    if (tAt[N - 1] < 0) tAt[N - 1] = n / 30;
    let last = 0;
    for (let i = 1; i < N; i++) {
        if (tAt[i] >= 0) {
            if (i - last > 1) for (let j = last + 1; j < i; j++) tAt[j] = tAt[last] + (tAt[i] - tAt[last]) * (j - last) / (i - last);
            last = i;
        }
    }
    ghostTimeAt = tAt;
}

// mazání jen "normálních" AI soupeřů - online 1v1 soupeř (o.remote) se maže výhradně cleanupOnlineOpponent()
function clearAIs() { aiList.filter(o => !o.remote).forEach(o => disposeObj(o.model.group)); aiList = aiList.filter(o => o.remote); }

function buildAIs() {
    clearAIs();
    if (cfg.mode !== 'race') return;
    const n = Math.min(cfg.ai, Q.maxAI);
    const rain = cfg.weather === 'rain';
    const d01 = cfg.aiDiff / 100;
    const total = n + 1;
    const ps = cfg.grid === 'first' ? 0 : (cfg.grid === 'middle' ? Math.floor(total / 2) : total - 1);
    const slots = [];
    for (let k = 0; k < total; k++) slots.push({ s: -(9 + 9 * k), lat: (k % 2 === 0 ? -3.2 : 3.2) });
    const pSlot = slots[ps];
    const rest = slots.filter((_, k) => k !== ps);
    const rng = mulberry32(Date.now() & 0xffff);
    const names = AI_NAMES.slice().sort(() => rng() - 0.5);
    for (let k = 0; k < n; k++) {
        const pool = cfg.track === 'oval' ? ['eagle', 'eagle', 'viper', 'apex'] : ['apex', 'zephyr', 'viper', 'apex', 'zephyr'];
        const def = carById(pool[Math.floor(rng() * pool.length)]);
        const gp = getProfile(cfg.track, def, null, rain);
        const color = AI_COLORS[k % AI_COLORS.length];
        const A = newAI(T, gp.prof, gp.P, rest[k], d01, mulberry32(1000 + k * 77 + (Date.now() & 255)), names[k % names.length], color);
        const look = Object.assign({}, def.look, { body: color, num: 2 + Math.floor(rng() * 97), pattern: ['center', 'side', 'double', 'none'][k % 4], stripe: '#ffffff' });
        const model = buildCarModel(def, look);
        model.group.traverse(o => { if (o.isMesh) o.castShadow = Q.shadows && o.geometry.type === 'BoxGeometry'; });
        scene.add(model.group);
        aiList.push({ A, model, def });
    }
    resetPlayer(pSlot.s, pSlot.lat);
}

// ---------------- relace ----------------
function startSession() {
    cfg = store.cfg;
    Q = getQuality();
    ensureTrack();
    setupPlayerCar();
    resetPlayer(-12, 0);
    buildAIs();
    reloadGhost();
    simT = 0; accT = 0; stepCount = 0;
    lastLap = null; sessionBest = null; penaltySec = 0; offCool = 0; wasOff = false;

function doShift(dir) {

window.addEventListener('keydown', (e) => {
    initAudio();
    const tg = e.target && e.target.tagName;
    if (tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA') { if (!(e.key === 'Escape')) return; }
    const k = e.key.toLowerCase();
    if (e.code === 'Space' || k.indexOf('arrow') === 0) e.preventDefault();
    if (hubOpen) {
        if ((k === 'escape' || k === 'm') && inSession) resumeSession();
        return;
    }
    if (e.repeat && k !== 'w' && k !== 's' && k !== 'a' && k !== 'd') return;
    if (k === 'm' || k === 'escape') { openHub(); return; }
    if (k === 'w' || k === 'arrowup') keys.w = true;
    else if (k === 's' || k === 'arrowdown') keys.s = true;
    else if (k === 'a' || k === 'arrowleft') keys.a = true;
    else if (k === 'd' || k === 'arrowright') keys.d = true;
    else if (k === 't') toggleManual();
    else if (k === 'c') { camMode = (camMode + 1) % 2; camSnap = true; }
    else if (k === 'r') resetToStart();
    else if (k === 'p') cyclePitTire();
    else if (e.code === 'Space' || k === 'e') doShift(1);
    else if (k === 'shift' || k === 'q') doShift(-1);
});
window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup') keys.w = false;
    else if (k === 's' || k === 'arrowdown') keys.s = false;
    else if (k === 'a' || k === 'arrowleft') keys.a = false;
    else if (k === 'd' || k === 'arrowright') keys.d = false;
});
window.addEventListener('blur', () => { keys.w = keys.s = keys.a = keys.d = false; });
window.addEventListener('pointerdown', () => initAudio());

function bindTouch(id, onDown, onUp) {

    const down = (e) => { e.preventDefault(); el.classList.add('act'); onDown(); };
    const up = (e) => { e.preventDefault(); el.classList.remove('act'); if (onUp) onUp(); };
    el.addEventListener('pointerdown', down);
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, up));
}
function setupTouch() {
    bindTouch('tb-left', () => touchKeys.left = true, () => touchKeys.left = false);

// ---------------- kola, sektory, penalizace, pit ----------------
function startLap() {
    lapStartT = simT; lapInvalid = false; lapInvalidShown = false;
    secT = [null, null, null]; curSec = 0; secStart = simT; ghostRec = []; stepCount = 0;
}

function completeLap(time) {
    secT[2] = simT - secStart;
    const p = profile(), key = cfg.track + '|' + cfg.car, prevBest = p.bests[key];
    const valid = !lapInvalid && time > 15 && S.wear >= 0;
    lastLap = time;
    p.stats.laps++;
    if (valid) {
        if (sessionBest === null || time < sessionBest) sessionBest = time;
        if (!prevBest || time * 1000 < prevBest.ms) {
            p.bests[key] = { ms: Math.round(time * 1000), sec: secT.slice(), date: Date.now() };
            if (ghostRec.length > 60) { saveGhost(cfg.track, cfg.car, ghostRec); ghostData = Int16Array.from(ghostRec); computeGhostTimes(); if (ghostModel === null && store.settings.ghost) reloadGhost(); }
            toast('🏆 Nový osobní rekord: ' + fmtTime(time), 2600);
            // nový osobní rekord - pošli i do globálního online žebříčku (pokud je hráč přihlášený přes Google)
            if (typeof online !== 'undefined' && online.user && typeof metoDB !== 'undefined') {
                metoDB.saveScore(carById(cfg.car).name, T.name, Math.round(time * 1000));
            }
        } else toast('Kolo ' + fmtTime(time) + '  (' + fmtDelta(time - prevBest.ms / 1000) + ')', 2200);
        const lvl = medalLevel(time * 1000, idealMsApex(cfg.track));
        if (lvl > (p.medals[cfg.track] || 0)) {
            p.medals[cfg.track] = lvl;
            setTimeout(() => toast('🏅 Medaile: ' + MEDAL_NAMES[lvl] + ' (' + T.name + ')', 2800), 2300);
            const gained = refreshUnlocks(p);
            gained.forEach((c, k) => setTimeout(() => { toast('🔓 Odemčeno auto: ' + c.name + '!', 3500); }, 5200 + k * 3600));
        }
    } else {
        toast('Neplatné kolo ' + fmtTime(time), 2000);
    }
    p.stats.km += 0;
    saveStore();
}

function lapLogic() {
    const li = Math.floor(S.prog / T.L);
    if (li > lapIndex) {
        if (lapIndex >= 0 && lapStartT !== null) {
            const time = simT - lapStartT;
            completeLap(time);
        }
        lapIndex = li;
        if (phase === 'racing' && race.nLaps && li >= race.nLaps && !race.finished) finishRace();
        else startLap();
    } else if (li < lapIndex) {
        lapIndex = li;
        if (li < 0) { lapStartT = null; ghostRec = []; deltaVal = null; }
        else lapInvalid = true;
    }
    // sektory
    if (lapStartT !== null) {
        const sec = Math.min(2, Math.floor(S.idx * 3 / T.N));
        if (sec !== curSec) {
            if (sec === curSec + 1) { secT[curSec] = simT - secStart; secStart = simT; curSec = sec; }
            else curSec = sec;
        }
        if (ghostTimeAt) deltaVal = (simT - lapStartT) - ghostTimeAt[S.idx];
        else deltaVal = null;
    }
    // záznam ducha (30 Hz)
    if (lapStartT !== null && (stepCount++ & 1) === 0) { ghostRec.push(Math.round(S.x * 10), Math.round(S.z * 10), Math.round(S.angle * 1000)); }
}

function trackLimits(dt) {
    if (offCool > 0) offCool -= dt;
    const off = !!S.off && Math.abs(S.speed) > 8;
    if (off && !wasOff && offCool <= 0 && (phase === 'free' || phase === 'racing')) {
        offCool = 2.5;
        if (store.settings.penalties) {
            lapInvalid = true;
            if (cfg.mode === 'race') { penaltySec += 2; toast('⚠ Mimo trať: +2 s', 1800); }
            else toast('⚠ Mimo trať – neplatné kolo', 1800);
        }
    }
    wasOff = off;
}

function pitLogic(dt) {
    let along = (S.idx - T.pitBoxIdx) * T.ds;
    if (along > T.L / 2) along -= T.L; else if (along < -T.L / 2) along += T.L;
    const inBox = inPitBox(T, S.idx, S.lat, along) && S.surface === 'pit';
    if (S.inPit) { if (pit.nextTire === null) pit.nextTire = tireChoice; }
    else if (!pit.active) pit.nextTire = null;
    if (!pit.active) {
        if (Math.abs(S.speed) > 3) pit.armed = true;
        if (inBox && pit.armed && Math.abs(S.speed) < 0.7 && phase !== 'countdown') {
            pit.active = true; pit.t = 0; pit.armed = false;
            const changing = pit.nextTire !== tireChoice;
            pit.dur = (changing ? 3.6 : 3.0) + Math.min(1.5, S.wear * 2.2);
            S.hold = true; toast('Pit stop – ' + COMPOUNDS[pit.nextTire].name + ' pneu (P – změnit)', 1600);
        }
    } else {
        pit.t += dt;
        const left = Math.max(0, pit.dur - pit.t);
        banner('BOX<small>Montáž: ' + COMPOUNDS[pit.nextTire].name + ' pneu… ' + left.toFixed(1) + ' s · <kbd>P</kbd> změnit</small>');
        if (pit.t >= pit.dur) {
            pit.active = false; S.hold = false; S.wear = 0;
            applyTireChoice(pit.nextTire); pit.nextTire = null;
            profile().stats.pits++; saveStore();
            banner(''); toast('Nové pneumatiky (' + COMPOUNDS[tireChoice].name + ') – jeď!', 1600); beep(900, 0.15);
            updateHudStatic();
        }
    }
    // zvýraznění boxu
    if (SHARED.boxMat) SHARED.boxMat.opacity = (Math.abs(S.speed) < 22 && S.inPit) ? 0.45 + 0.2 * Math.sin(simT * 6) : 0.3;
}

// ---------------- závod ----------------
function raceStandings() {
    const all = [{ name: profile().name, isPlayer: true, prog: S.prog, finished: race.finished, time: race.finishTime, avatar: profile().avatar }];
    aiList.forEach(o => all.push({ name: o.A.name, isPlayer: false, prog: o.A.prog, finished: o.A.finished, time: o.A.finishTime, car: o.def.name, A: o.A }));
    all.sort((a, b) => {
        if (a.finished && b.finished) return a.time - b.time;
        if (a.finished) return -1; if (b.finished) return 1;
        return b.prog - a.prog;
    });
    return all;
}
function finishRace() {
    race.finished = true; race.finishTime = simT - race.gunT + penaltySec;
    phase = 'finished'; race.finishAt = simT;
    const st = raceStandings();
    const pos = st.findIndex(r => r.isPlayer) + 1;
    const p = profile(); p.stats.races++; if (pos === 1) p.stats.wins++; saveStore();
    banner(pos === 1 ? '🏁 VÍTĚZSTVÍ!' : '🏁 CÍL – ' + pos + '. místo');
    beep(1200, 0.5);
}
function showResults() {
    race.resultsShown = true;
    const st = raceStandings();
    const leader = st[0];
    let html = '<h2>VÝSLEDKY ZÁVODU</h2><div class="hint">' + esc(T.name) + ' · ' + race.nLaps + ' kol' + (penaltySec ? ' · penalizace +' + penaltySec + ' s' : '') + '</div><table class="lb"><tr><th>#</th><th>Jezdec</th><th>Čas / ztráta</th></tr>';
    st.forEach((r, i) => {
        let t;
        if (r.finished) t = i === 0 ? fmtTime(r.time) : '+' + (r.time - leader.time).toFixed(2) + ' s';
        else t = 'v jízdě (' + Math.max(0, Math.round(leader.prog - r.prog)) + ' m)';
        html += '<tr class="' + (r.isPlayer ? 'me' : '') + '"><td>' + (i + 1) + '</td><td>' + (r.isPlayer ? esc(r.avatar) + ' ' : '') + esc(r.name) + (r.car ? ' <span class="tag">' + esc(r.car) + '</span>' : '') + '</td><td class="t">' + t + '</td></tr>';
    });
    html += '</table><div class="row" style="margin-top:14px"><button class="btn primary" data-res="again">ZNOVU</button><button class="btn" data-res="menu">Nabídka</button></div>';
    const box = document.getElementById('results-box');
    box.innerHTML = html;
    document.getElementById('results').classList.remove('hidden');
}
document.getElementById('results').addEventListener('click', (e) => {
    const b = e.target.closest('[data-res]');
    if (!b) return;
    document.getElementById('results').classList.add('hidden');
    if (b.dataset.res === 'again') startSession(); else { openHub(); }
});

// ---------------- hlavní fyzikální krok ----------------
function simStep(dt) {
    simT += dt;
    prev.x = S.x; prev.z = S.z; prev.angle = S.angle;
    let inp = readInput();

    if (phase === 'countdown') {
        race.countT += dt; inp = { throttle: 0, brake: 0, steer: 0 }; S.hold = true;
        const c = race.countT;
        if (c >= 5.4) {
            phase = 'racing'; race.gunT = simT; S.hold = false; lapStartT = null;
            setLights(6); beep(1400, 0.45); banner('<span style="color:#5be37d">START!</span>'); setTimeout(() => { if (phase === 'racing') banner(''); }, 1200);
            setTimeout(() => setLights(-1), 1500);
        } else {
            const on = Math.min(5, Math.max(0, Math.floor((c - 0.4) / 0.9) + 1));
            if (on !== race._lastOn) { race._lastOn = on; setLights(on); if (on > 0) beep(700, 0.15); }
        }
    }
    const going = phase === 'racing' || phase === 'free' || phase === 'finished';
    stepCar(S, P, inp, W, dt);
    if (S.impact > 0.5 && S.impact > (S.lastImpact || 0) * 0.5) { thump(S.impact / 10); }
    S.lastImpact = S.impact;
    profile().stats.km += Math.abs(S.speed) * dt / 1000;
    pitLogic(dt);
    if (going) { lapLogic(); trackLimits(dt); }

    // AI
    if (aiList.length) {
        proxy.prog = S.prog; proxy.lat = S.lat; proxy.v = S.speed;
        const others = [proxy];
        aiList.forEach(o => others.push(o.A));
        const go = phase === 'racing' || phase === 'finished';
        aiList.forEach(o => {
            if (o.remote) return;  // online 1v1 soupeř - řídí ho vzdálený hráč, viz updateOnlineOpponent()
            stepAI(o.A, T, line, others, dt, go);
            if (!o.A.finished && phase !== 'countdown' && o.A.prog >= race.nLaps * T.L) { o.A.finished = true; o.A.finishTime = simT - race.gunT; }
            const imp = resolveContact(S, P, o.A, dt);
            if (imp > 3) thump(imp / 12);
        });
    }
    if (cfg.mode === 'online' && typeof updateOnlineOpponent === 'function') updateOnlineOpponent(dt);
    if (phase === 'finished' && !race.resultsShown && simT - race.finishAt > 2.2) showResults();
}

// ---------------- zvuk ----------------
const audio = { ctx: null };
function initAudio() {
    if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
        const ctx = new AC(); audio.ctx = ctx;
        audio.master = ctx.createGain(); audio.master.gain.value = store.settings.volume / 100; audio.master.connect(ctx.destination);
        audio.eg = ctx.createGain(); audio.eg.gain.value = 0;
        audio.ef = ctx.createBiquadFilter(); audio.ef.type = 'lowpass'; audio.ef.Q.value = 1.2;
        audio.ef.connect(audio.eg); audio.eg.connect(audio.master);
        audio.oscs = [];
        [['sawtooth', 1, 0.5], ['square', 0.5, 0.22], ['sawtooth', 1.006, 0.35]].forEach(([type, mult, gain]) => {
            const o = ctx.createOscillator(); o.type = type; const g = ctx.createGain(); g.gain.value = gain; o.connect(g); g.connect(audio.ef); o.start(); audio.oscs.push({ o, mult });
        });
        const len = ctx.sampleRate * 2, nb = ctx.createBuffer(1, len, ctx.sampleRate), d = nb.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const chain = (q, type) => { const s = ctx.createBufferSource(); s.buffer = nb; s.loop = true; const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q; const g = ctx.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); g.connect(audio.master); s.start(); return { f, g }; };
        audio.squeal = chain(9, 'bandpass'); audio.rough = chain(0.8, 'bandpass'); audio.rainN = chain(0.4, 'highpass');
        audio.rainN.f.frequency.value = 2500;
    } catch (e) { audio.ctx = null; }
}
function beep(freq, dur) {
    if (!audio.ctx) return;
    const c = audio.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq; g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);

// ---------------- vykreslení ----------------
const UPV = { x: 0, y: 1, z: 0 };
function renderFrame(now, dt, alpha) {
    const rx = prev.x + (S.x - prev.x) * alpha, rz = prev.z + (S.z - prev.z) * alpha;
    const ra = prev.angle + wrapPi(S.angle - prev.angle) * alpha;
    const ry = heightAt(T, S.idx, S.lat);
    const sl = slopeAt(T, S.idx, S.lat);
    const dotn = T.nx[S.idx] * Math.cos(ra) - T.nz[S.idx] * Math.sin(ra);
    const roll = Math.atan(sl * dotn);
    const vib = S.surface === 'kerb' && Math.abs(S.speed) > 3 ? 1 : (S.surface === 'gravel' && Math.abs(S.speed) > 3 ? 0.7 : 0);

    const pg = playerModel.group;
    pg.position.set(rx, ry + Math.sin(now * 0.09) * 0.035 * vib, rz);
    pg.rotation.y = ra;
    pg.rotation.z = roll + Math.sin(now * 0.071) * 0.02 * vib - S.aLat * 0.0025;
    pg.rotation.x = clamp(S.aLongS * 0.0018, -0.04, 0.04);
    playerModel.wheels[0].rotation.y = playerModel.wheels[1].rotation.y = S.steer * Math.min(P.lock, 0.5);
    const spin = S.speed * dt / carDef.dims.wheelR;
    playerModel.wheels.forEach(w => { w.children[0].rotation.x -= spin; w.children[1].rotation.x -= spin; });
    playerModel.tailM.color.setHex(S.brk > 0.3 ? 0xff1a1a : 0x660000);

    // světlomety
    const ca = Math.cos(ra), sa = Math.sin(ra);
    headlights.forEach((h, k) => {
        const sx = k === 0 ? -0.7 : 0.7;
        h.position.set(rx + sx * ca + (-carDef.dims.len / 2) * sa, ry + 0.85, rz - sx * sa + (-carDef.dims.len / 2) * ca);
        h.target.position.set(rx + sx * ca + (-40) * sa, ry, rz - sx * sa + (-40) * ca);
    });
    dirLight.position.set(rx + 100, 150, rz + 100); dirLight.target.position.set(rx, 0, rz);

    // AI
    aiList.forEach(o => {
        const A = o.A, g = o.model.group;
        g.position.set(A.x, heightAt(T, A.idx, A.lat), A.z); g.rotation.y = A.angle;
        const sl2 = slopeAt(T, A.idx, A.lat);
        g.rotation.z = Math.atan(sl2 * (T.nx[A.idx] * Math.cos(A.angle) - T.nz[A.idx] * Math.sin(A.angle)));
        const sp = A.v * dt / o.def.dims.wheelR;
        o.model.wheels.forEach(w => { w.children[0].rotation.x -= sp; w.children[1].rotation.x -= sp; });
    });

    // duch
    if (ghostModel) {
        let show = false;
        if (ghostData && lapStartT !== null && !hubOpen) {
            const f = (simT - lapStartT) * 30, i0 = Math.floor(f), n = Math.floor(ghostData.length / 3);
            if (i0 >= 0 && i0 < n - 1) {
                const u = f - i0, a0 = ghostData[i0 * 3 + 2] / 1000, a1 = ghostData[(i0 + 1) * 3 + 2] / 1000;
                const gx = lerp(ghostData[i0 * 3], ghostData[(i0 + 1) * 3], u) / 10, gz = lerp(ghostData[i0 * 3 + 1], ghostData[(i0 + 1) * 3 + 1], u) / 10;
                const q = locate(T, gx, gz, S.idx > 0 ? -1 : -1);
                ghostModel.group.position.set(gx, heightAt(T, q.i, q.lat), gz);
                ghostModel.group.rotation.y = a0 + wrapPi(a1 - a0) * u;
                show = true;
            }
        }
        ghostModel.group.visible = show;
    }

    // kamera
    const shake = S.wall > 0 ? S.wall * 0.8 : 0, vshake = vib * 0.04;
    if (hubOpen) {
        orbitT += dt * 0.25;
        const R = 9;
        camera.position.set(rx + Math.cos(orbitT) * R, ry + 3.2, rz + Math.sin(orbitT) * R);
        camera.lookAt(rx, ry + 0.9, rz);
        camBase = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
    } else if (camMode === 1) {
        const cp = new THREE.Vector3(0, 1.25, -0.1).applyAxisAngle(UP3, ra).add(pg.position);
        camera.position.set(cp.x + (Math.random() - 0.5) * (shake + vshake), cp.y + (Math.random() - 0.5) * (shake + vshake), cp.z);
        const look = new THREE.Vector3(0, 1.2, -6).applyAxisAngle(UP3, ra).add(pg.position);
        camera.lookAt(look);
    } else {
        const back = 8.5 + Math.min(3, Math.abs(S.speed) * 0.04);
        const ideal = new THREE.Vector3(0, 3.6, back).applyAxisAngle(UP3, ra).add(pg.position);
        if (camSnap) { camBase.x = ideal.x; camBase.y = ideal.y; camBase.z = ideal.z; camSnap = false; }
        else {
            const k = 1 - Math.pow(1 - 0.12, dt * 60);
            camBase.x += (ideal.x - camBase.x) * k; camBase.y += (ideal.y - camBase.y) * k; camBase.z += (ideal.z - camBase.z) * k;
        }
        camera.position.set(camBase.x + (Math.random() - 0.5) * (shake + vshake), camBase.y + (Math.random() - 0.5) * (shake + vshake), camBase.z + (Math.random() - 0.5) * (shake + vshake));
        camera.lookAt(pg.position.x, pg.position.y + 1.2, pg.position.z);
    }
    const tf = 60 + Math.min(1, Math.abs(S.speed) / 80) * 14;
    if (Math.abs(camera.fov - tf) > 0.05) { camera.fov += (tf - camera.fov) * 0.08; camera.updateProjectionMatrix(); }

    // ideální stopa
    if (lineMesh) {
        lineMesh.visible = !!store.settings.line && !hubOpen;
        if (lineMesh.visible) updateLineMesh(T, line, prof, S.idx, S.speed);
    }
    updateRain(dt, camera.position);
    drawMinimap(rx, rz, ra);
    updateHUD(now);
    updateAudio();
    renderer.render(scene, camera);
}
const UP3 = new THREE.Vector3(0, 1, 0);

// ---------------- smyčka ----------------
const DT = 1 / 60;
let lastProc = performance.now(), fpsFrames = 0, fpsT = 0, fpsVal = 60, lowFpsSecs = 0, fpsHinted = false;
function frame(now) {
    requestAnimationFrame(frame);
    if (!renderer || !S) return;
    const cap = Q.fpsCap;
    if (cap > 0 && now - lastProc < 1000 / cap - 2) return;
    let dt = (now - lastProc) / 1000; lastProc = now;
    dt = clamp(dt, 0, 0.1);
    fpsFrames++; fpsT += dt;
    if (fpsT >= 1) {
        fpsVal = fpsFrames / fpsT; fpsFrames = 0; fpsT = 0;
        if (store.settings.showFps) document.getElementById('fps').textContent = Math.round(fpsVal) + ' FPS';
        if (!hubOpen && fpsVal < 26) lowFpsSecs++; else lowFpsSecs = 0;
        if (lowFpsSecs >= 4 && !fpsHinted && store.settings.quality !== 'low') { fpsHinted = true; toast('Nízké FPS – v nabídce (M → Nastavení) snižte kvalitu', 4500); }
    }
    if (inSession && !hubOpen) {
        accT += dt;
        let n = 0;
        while (accT >= DT && n < 5) { simStep(DT); accT -= DT; n++; }
        if (n === 5) accT = 0;
    }
    renderFrame(now, dt, hubOpen ? 1 : accT / DT);
}

function applyBind(path, val) {
    const i = path.indexOf(':'), scope = path.slice(0, i), key = path.slice(i + 1);
    if (scope === 'cfg') {
        const prevVal = cfg[key];
        cfg[key] = val; saveStore();
        // ruční přepnutí z režimu "online" pryč (tlačítky Volná jízda/Závod) musí opustit 1v1 místnost,
        // jinak zůstane na trati "zamrzlý" soupeř a druhý hráč zůstane připojený v už opuštěném závodě
        if (key === 'mode' && prevVal === 'online' && val !== 'online' && typeof onOnlineAction === 'function') onOnlineAction('online-leave');
        if (key === 'track') { ensureTrack(); setupPlayerCar(); resetPlayer(-12, 0); buildAIs(); reloadGhost(); markDirty(); }
        else if (key === 'weather' || key === 'time') { applyEnvironment(cfg, Q); if (key === 'weather') { setupPlayerCar(); } markDirty(); }
        else if (key === 'manual') { if (S) S.manual = !!val; }
        else markDirty();
    } else if (scope === 'set') {
        store.settings[key] = val; saveStore();
        if (key === 'volume' && audio.master) audio.master.gain.value = val / 100;
        if (key === 'ghost') reloadGhost();
        if (key === 'touch') setupTouchVisibility();
    } else if (scope === 'tune') {
        const t = getTune(cfg.car); t[key] = val; profile().tune[cfg.car] = t; saveStore();
        setupPlayerCar(); S.manual = !!cfg.manual; markDirty(); reloadGhost();
    } else if (scope === 'look') {
        const l = getLook(cfg.car); l[key] = val; profile().look[cfg.car] = l; saveStore();
        rebuildPlayerModel(); reloadGhost();
    } else if (scope === 'q') {
        const cur = getQuality(); cur[key] = val; store.settings.q = cur; store.settings.quality = 'custom'; saveStore();
        if (inSession || true) applyQualityLive();
    }
    updateHudStatic();
}

    const act = a.dataset.act, v = a.dataset.v;

    } else if (act === 'track') { applyBind('cfg:track', v); renderTab(); }
    else if (act === 'preset') {
        store.settings.quality = v; store.settings.q = null; saveStore(); applyQualityLive(); renderTab();
    } else if (act === 'diff') { applyBind('cfg:aiDiff', Number(v)); renderTab(); }
    else if (act === 'switch') { store.active = v; saveStore(); normalizeProfile(profile()); const gained = refreshUnlocks(profile()); if (!carUnlocked(profile(), carById(cfg.car))) cfg.car = 'apex'; setupPlayerCar(); resetPlayer(-12, 0); reloadGhost(); markDirty(); showHub(); }
    else if (act === 'newprof') {
        const nm = $('new-name').value.trim() || ('Hráč ' + (Object.keys(store.profiles).length + 1));
        createProfile(nm, newAvatar); cfg.car = 'apex'; setupPlayerCar(); resetPlayer(-12, 0); reloadGhost(); markDirty(); showHub();
    } else if (act === 'avatar') { newAvatar = v; renderTab(); }

function onHubInput(e) {
    const r = e.target.closest('input[data-k]');
    if (!r) return;

    if (t === 'range') {
        const val = Number(r.value);
        const out = r.parentElement.querySelector('output'); if (out) out.textContent = fmtSlider(r.dataset.k, val);
        applyBind(r.dataset.k, val);
        if (r.dataset.k.indexOf('tune:') === 0) updateGarageStats();
    } else if (t === 'color') applyBind(r.dataset.k, r.value);
    else if (t === 'number') { const n = clamp(Math.round(Number(r.value) || 0), 0, 99); applyBind(r.dataset.k, n); }
}
function onHubChange(e) {
    const el = e.target.closest('[data-k]');
    if (!el) return;
    if (el.type === 'checkbox') { applyBind(el.dataset.k, el.checked); renderTab(); }
    else if (el.tagName === 'SELECT') { applyBind(el.dataset.k, convert(el.value, el.dataset.n)); renderTab(); }
}
function fmtSlider(k, v) {
    const key = k.slice(k.indexOf(':') + 1);
    if (key === 'gear') return v === 0 ? 'základní' : (v < 0 ? 'kratší ' + (-v) : 'delší ' + v);
    if (key === 'df') return v + '/10';
    if (key === 'brake') return v + '/10';
    if (key === 'bias') return v === 0 ? 'vyvážené' : (v < 0 ? 'zadek ' + (-v) : 'předek ' + v);
    if (key === 'aiDiff') return v + ' %';
    if (key === 'ai') return String(v);
    if (key === 'volume') return v + ' %';
    if (key === 'rain') return String(v);
    if (key === 'far') return v + ' m';
    if (key === 'maxAI') return String(v);
    return String(v);
}

function drawPreviews() {
    tabEl.querySelectorAll('canvas.track-prev').forEach(cv => {
        const T2 = getTrackObj(cv.dataset.track).T, g = cv.getContext('2d'), w = cv.width, h = cv.height, b = T2.bounds;
        const sc = Math.min((w - 16) / (b.maxX - b.minX), (h - 16) / (b.maxZ - b.minZ));
        const ox = (w - (b.maxX - b.minX) * sc) / 2 - b.minX * sc, oz = (h - (b.maxZ - b.minZ) * sc) / 2 - b.minZ * sc;
        g.clearRect(0, 0, w, h); g.lineJoin = 'round'; g.strokeStyle = '#d7d9e5'; g.lineWidth = 3; g.beginPath();
        for (let i = 0; i <= T2.N; i += 4) { const k = Math.min(i, T2.N - 1); const x = T2.x[k] * sc + ox, z = T2.z[k] * sc + oz; if (i === 0) g.moveTo(x, z); else g.lineTo(x, z); }
        g.closePath(); g.stroke();
        g.fillStyle = '#34c759'; g.beginPath(); g.arc(T2.x[0] * sc + ox, T2.z[0] * sc + oz, 4, 0, 6.3); g.fill();
    });
}

}

// ===================================================================
// METO Racing – online vrstva: napojení na window.metoDB (fb_module.js)
// Google účet, online přezdívka, globální TOP 10 a 1v1 multiplayer po síti.
// Běží ve stejném globálním rozsahu jako game_main.js/game_ui.js (viz build.py).
// ===================================================================
const online = {
    user: null, nick: '', top10: null, top10err: false,
    code: null, role: null, status: 'idle', msg: '',
    opp: { present: false, name: '', car: 'apex' },
    sessionStarted: false, lastSync: 0, result: null
};

function onlineReady() { return typeof metoDB !== 'undefined' && metoDB && metoDB.ready && metoDB.ready(); }

// ---------------- auth / profil ----------------
window.onAuthUIUpdate = function (user, nick) {
    online.user = user; online.nick = nick || '';
    if (user && online.top10 === null) metoDB.listenTop10((list) => { online.top10 = list; online.top10err = !list; if (hubOpen && curTab === 'online') renderTab(); });
    if (hubOpen && curTab === 'online') renderTab();
};
// žebříček se hodí vidět i bez přihlášení
(function initTop10() {
    if (typeof metoDB === 'undefined') { setTimeout(initTop10, 300); return; }
    if (metoDB.ready && metoDB.ready()) metoDB.listenTop10((list) => { online.top10 = list; online.top10err = !list; if (hubOpen && curTab === 'online') renderTab(); });
})();

// ---------------- místnost 1v1 ----------------
window.onRoomUpdate = function (roomData, role, code) {
    if (!roomData) {
        const wasOnline = online.status !== 'idle';
        online.code = null; online.role = null; online.status = 'idle'; online.opp.present = false; online.sessionStarted = false;
        if (wasOnline && cfg && cfg.mode === 'online' && inSession && phase !== 'finished') {
            toast('Soupeř opustil online závod', 2600); banner('');
        }
        cleanupOnlineOpponent();
        if (hubOpen && curTab === 'online') renderTab();
        return;
    }
    online.code = code; online.role = role; online.status = roomData.status; online.room = roomData;
    const oppKey = role === 'host' ? 'guest' : 'host';
    const oppData = roomData[oppKey];
    online.opp.present = !!oppData;
    if (oppData) {
        online.opp.name = oppData.nick || 'Soupeř'; online.opp.car = oppData.car || 'apex';
        if (window.__onlineOppA) {
            const A = window.__onlineOppA;
            A.tx = oppData.x; A.tz = oppData.z; A.tangle = oppData.angle || 0;
            A.lap = oppData.lap || 1; A.finished = !!oppData.finished; A.finishTime = (oppData.finishTime || 0) / 1000;
        }
    }
    if (roomData.status === 'finished' && roomData.winnerNick) {
        online.result = { winner: roomData.winnerNick, timeMs: roomData.winnerTime };
    }
    if (roomData.status === 'countdown' && !online.sessionStarted && role) {
        online.sessionStarted = true;
        startOnlineSession(roomData, role);
    }
    if (hubOpen && curTab === 'online') renderTab();
};

function makeNickSprite(text) {
    const c = document.createElement('canvas'); c.width = 256; c.height = 64;
    const ctx = c.getContext('2d');
    ctx.fillStyle = 'rgba(10,10,16,0.55)'; ctx.fillRect(0, 10, 256, 44);
    ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(String(text || 'Soupeř').slice(0, 14), 128, 42);
    const tex = new THREE.CanvasTexture(c);
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
    spr.scale.set(3.2, 0.8, 1); spr.position.set(0, 2.1, 0);
    return spr;
}

// spustí se u obou hráčů, jakmile místnost přejde do 'countdown' (host i guest skoro současně)
function startOnlineSession(roomData, role) {
    cfg = store.cfg; cfg.mode = 'online'; cfg.track = roomData.track || cfg.track; cfg.laps = roomData.totalLaps || 3; saveStore();
    startSession();
    resetPlayer(-12, role === 'host' ? -3.2 : 3.2);
    cleanupOnlineOpponent();
    const oppDef = carById(online.opp.car || 'apex');
    const look = Object.assign({}, oppDef.look, { body: '#38bdf8', stripe: '#0b1220', pattern: 'side' });
    const model = buildCarModel(oppDef, look);
    model.group.traverse(o => { if (o.isMesh) o.castShadow = Q.shadows && o.geometry.type === 'BoxGeometry'; });
    model.group.add(makeNickSprite(online.opp.name));
    scene.add(model.group);
    window.__onlineOppModel = model.group;
    const startS = role === 'host' ? -3.2 : 3.2;
    const A = {
        x: S.x, z: S.z, angle: S.angle, tx: S.x, tz: S.z, tangle: S.angle, idx: S.idx, lat: -startS, v: 0,
        prog: 0, lap: 1, finished: false, finishTime: 0, name: online.opp.name || 'Soupeř', color: '#38bdf8'
    };
    window.__onlineOppA = A;
    aiList.push({ A, model, def: oppDef, remote: true });
    online.lastSync = 0; online.finishSent = false;
    toast('1v1 online: ' + (online.opp.name || 'soupeř') + ' – ' + roomData.totalLaps + ' kol', 2600);
}

// volá se jednou za snímek ze simStep() (viz patch v game_main.js) – jen když cfg.mode === 'online'
function updateOnlineOpponent(dt) {
    const o = aiList.find(x => x.remote);
    if (!o) return;
    const A = o.A;
    const k = 1 - Math.pow(1 - 0.2, dt * 60);
    A.x += (A.tx - A.x) * k; A.z += (A.tz - A.z) * k;
    A.angle += wrapPi(A.tangle - A.angle) * k;
    const q = locate(T, A.x, A.z, A.idx, 60);
    A.idx = q.i; A.lat = q.lat;
    A.prog = Math.max(0, (A.lap - 1)) * T.L + A.idx * T.ds;

    // odesílání vlastního stavu ~10x/s
    online.lastSync += dt;
    if (online.lastSync >= 0.1 && online.code && typeof metoDB !== 'undefined') {
        online.lastSync = 0;
        metoDB.syncPlayerState({ x: S.x, z: S.z, angle: S.angle, lap: lapIndex + 1, braking: keys.s || touchKeys.brake, finished: race.finished, finishTime: race.finished ? Math.round(race.finishTime * 1000) : 0 });
    }
    // konec 1v1 závodu – kdo dojel dřív, zapíše se jako vítěz (chráněno transakcí ve fb_module.js)
    // volat jen JEDNOU (ne každý snímek), ať nezahlcujeme databázi zbytečnými zápisy
    if (race.finished && online.code && !online.finishSent) {
        online.finishSent = true;
        metoDB.finishRoom(profile().name, Math.round(race.finishTime * 1000));
    }
}

function cleanupOnlineOpponent() {
    const idx = aiList.findIndex(x => x.remote);
    if (idx >= 0) { disposeObj(aiList[idx].model.group); aiList.splice(idx, 1); }
    window.__onlineOppModel = null; window.__onlineOppA = null;
}

// ---------------- UI akce ze záložky Online ----------------
function onOnlineAction(act, v) {
    if (act === 'online-login') { if (typeof metoDB !== 'undefined') metoDB.loginGoogle(); else toast('Online vrstva se nenačetla', 2000); }
    else if (act === 'online-logout') { metoDB.logoutGoogle(); }
    else if (act === 'online-nick-save') {
        const el = $('online-nick-input'); if (!el) return;
        metoDB.saveNickname(el.value).then(ok => { if (ok) { toast('Online přezdívka uložena', 1600); renderTab(); } });
    } else if (act === 'online-create') {
        if (!online.user) { toast('Nejdřív se přihlas přes Google', 2000); return; }
        metoDB.createRoom(cfg.car, cfg.track, cfg.laps || 3).then(code => { if (code) { online.sessionStarted = false; online.result = null; renderTab(); } });
    } else if (act === 'online-join') {
        const el = $('online-join-input'); if (!el) return;
        if (!online.user) { toast('Nejdřív se přihlas přes Google', 2000); return; }
        metoDB.joinRoom(el.value, cfg.car).then(track => { if (track) { online.sessionStarted = false; online.result = null; renderTab(); } });
    } else if (act === 'online-leave') {
        metoDB.leaveRoom(); cleanupOnlineOpponent();
        if (cfg && cfg.mode === 'online') { cfg.mode = 'free'; saveStore(); }
        online.result = null; renderTab();
    } else if (act === 'online-again') { online.result = null; renderTab(); }
}

        mpBody += '<div class="row" style="margin-top:6px"><button class="btn sm" data-act="online-again">Nový 1v1 závod</button></div>';
    } else if (online.code) {
        mpBody = '<div class="hint">Kód místnosti: <b style="font-size:18px;letter-spacing:3px">' + esc(online.code) + '</b> (' + (online.role === 'host' ? 'jsi hostitel' : 'připojen jako host') + ')</div>';
        mpBody += '<div class="hint">' + (online.opp.present ? 'Soupeř ' + esc(online.opp.name) + ' připojen – závod začíná automaticky.' : 'Čekám na soupeře… pošli mu kód.') + '</div>';
        mpBody += '<div class="row" style="margin-top:6px"><button class="btn sm" data-act="online-leave">Opustit 1v1</button></div>';
    } else {
        mpBody = '<div class="hint">Závodí se na trati a autě, které máš teď vybrané v záložce Závod (' + esc((T ? T.name : cfg.track)) + ', ' + esc(carById(cfg.car).name) + '), na ' + (cfg.laps || 3) + ' kol.</div>';
        mpBody += '<div class="row" style="margin-top:6px"><button class="btn sm primary" data-act="online-create">+ Vytvořit 1v1 závod</button></div>';
        mpBody += '<div class="row" style="margin-top:6px"><input type="text" id="online-join-input" maxlength="4" placeholder="Kód (4 čísla)" style="max-width:120px;font-family:monospace;text-align:center"><button class="btn sm" data-act="online-join">Připojit se</button></div>';
    }
    h += acc('online.mp', '1v1 online závod', mpBody, true);
    return h;
}
