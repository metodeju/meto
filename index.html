<!DOCTYPE html>
<html lang="cs">
<head> <link rel="icon" type="image/png" href="ikona.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probíhá aktualizace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        /* Styl pro červenobílé pruhy inspirované logem */
        .stripe-container {
            width: 100%;
            height: 24px;
            background: repeating-linear-gradient(
                90deg,
                #ffffff,
                #ffffff 40px,
                #ef4444 40px,
                #ef4444 80px
            );
        }

        .content {
            max-width: 600px;
            padding: 2rem;
        }

        /* Vykreslení grafického loga z čtverců */
        .logo-blocks {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2rem;
        }

        .logo-block {
            width: 45px;
            height: 45px;
            background-color: #ef4444;
            border-radius: 4px;
            animation: pulse 2s infinite ease-in-out;
        }

        .logo-block:nth-child(2) { animation-delay: 0.3s; }
        .logo-block:nth-child(3) { animation-delay: 0.6s; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.85); opacity: 0.6; }
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.5rem 1rem;
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Horní dekorativní pruh -->
    <div class="stripe-container"></div>

    <div class="content">
        <!-- Logo složené ze čtverců (odpovídá stylu tvého obrázku) -->
        <div class="logo-blocks">
            <div class="logo-block"></div>
            <div class="logo-block"></div>
            <div class="logo-block"></div>
        </div>

        <h1>Stránka se právě aktualizuje</h1>
        <p>Na webu v tuto chvíli pracujeme, abychom vám přinesli nové funkce a vylepšení. Děkujeme za trpělivost, brzy budeme zpět.
    
        <div class="status-badge">Probíhá údržba</div>
    </div>

    <!-- Dolní dekorativní pruh -->
    <div class="stripe-container"></div>

</body>
</html>
