<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>METO Racing</title>
<style>
:root { --bg:#0e0e14; --panel:rgba(15,15,22,.88); --line:#2c2c3a; --txt:#eceef5; --mut:#8b90a3; --red:#ff3b30; --cy:#00d2ff; --gr:#34c759; --ye:#ffcc00; }
* { box-sizing: border-box; }
html,body { margin:0; height:100%; overflow:hidden; background:#111; color:var(--txt); font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
#canvas-container { position:fixed; inset:0; }
.hidden { display:none !important; }
kbd { background:#333; padding:1px 6px; border-radius:4px; border:1px solid #555; font-family:monospace; color:#fff; font-size:12px; }
.label { font-size:11px; text-transform:uppercase; color:var(--mut); letter-spacing:1px; margin-bottom:4px; }
#hud.off > * { display:none !important; }

/* ---------- HUD ---------- */
#controls-info { position:absolute; top:14px; left:14px; background:rgba(15,15,22,.7); padding:10px 14px; border-radius:10px; border-left:4px solid var(--red); font-size:12.5px; line-height:1.55; color:#ddd; max-width:330px; }
#controls-info b { color:#fff; }
#dash { position:absolute; bottom:22px; right:22px; display:flex; align-items:flex-end; gap:18px; background:var(--panel); padding:16px 24px; border-radius:14px; border:2px solid #333; box-shadow:0 10px 30px rgba(0,0,0,.7); }
.gauge-box { text-align:center; }
#speed-val { font-size:46px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; min-width:96px; }
#gear-val { font-size:52px; font-weight:900; color:var(--red); background:#222; width:64px; height:64px; line-height:64px; border-radius:10px; border:2px solid #444; text-align:center; margin:0 auto; }
.dash-col { width:210px; }
#rpm-bg { position:relative; height:18px; background:#222; border-radius:9px; overflow:hidden; border:1px solid #444; }
#rpm-bar { height:100%; width:0; background:linear-gradient(90deg,#34c759,#ffcc00 70%,#ff3b30); }
#rpm-red { position:absolute; right:0; top:0; bottom:0; width:8%; background:rgba(255,59,48,.25); border-left:1px solid #ff3b30; }
.mini-row { display:flex; align-items:center; gap:8px; margin-top:7px; font-size:11px; color:var(--mut); }
.mini-row > span { width:50px; }
.mini-row b { width:38px; text-align:right; color:#ddd; font-variant-numeric:tabular-nums; }
.bar { flex:1; height:8px; background:#222; border-radius:4px; overflow:hidden; border:1px solid #3a3a48; }
#wear-bar { height:100%; width:100%; background:linear-gradient(90deg,#ff3b30,#ffcc00 40%,#34c759); }
.split { flex:1; height:8px; background:#ff9f0a; border-radius:4px; overflow:hidden; border:1px solid #3a3a48; }
#load-f { height:100%; width:50%; background:#0a84ff; }
#surface-tag { margin-top:7px; font-size:11px; color:var(--cy); font-weight:700; letter-spacing:1px; height:14px; }
#shift-area { position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; }
#shiftlights { display:flex; gap:5px; background:rgba(15,15,22,.8); padding:7px 11px; border-radius:20px; border:2px solid #333; }
.led { width:16px; height:16px; border-radius:50%; background:#2a2a2a; border:1px solid #444; }
.led.on-g { background:#34c759; box-shadow:0 0 10px #34c759; } .led.on-y { background:#ffcc00; box-shadow:0 0 10px #ffcc00; } .led.on-r { background:#ff3b30; box-shadow:0 0 12px #ff3b30; }
#shift-arrow { display:flex; flex-direction:column; align-items:center; color:var(--red); font-weight:900; text-shadow:0 0 18px rgba(255,59,48,.9); animation:blink .28s steps(2,start) infinite; }
#shift-arrow .arrow { font-size:60px; line-height:52px; } #shift-arrow .txt { font-size:17px; letter-spacing:3px; }
@keyframes blink { to { opacity:.15; } }
#timer-box { position:absolute; top:14px; right:14px; width:230px; background:var(--panel); padding:12px 16px; border-radius:12px; border:2px solid #333; font-family:ui-monospace,Consolas,monospace; text-align:right; box-shadow:0 5px 15px rgba(0,0,0,.5); }
#timer-box .row { display:flex; justify-content:space-between; font:700 11px 'Segoe UI',sans-serif; color:var(--cy); letter-spacing:1px; }
#t-lap { font-size:30px; font-weight:700; color:var(--gr); margin:2px 0; }
#t-lap.bad { color:#ff6b61; text-decoration:line-through; }
#t-delta { font-size:16px; font-weight:700; height:20px; color:var(--mut); }
#t-delta.pos { color:#ff6b61; } #t-delta.neg { color:#5be37d; }
#timer-box .sub { font-size:12px; color:#bbb; margin-top:2px; } #timer-box .sub b { color:var(--ye); font-weight:700; } #timer-box .small { font-size:11px; color:var(--mut); }
.sectors { display:flex; justify-content:space-between; margin-top:6px; font-size:11px; gap:4px; }
.sectors span { flex:1; text-align:center; padding:2px 0; background:#1d1d28; border-radius:4px; color:#999; }
.sectors .g { color:#5be37d; } .sectors .r { color:#ff6b61; } .sectors .cur { outline:1px solid var(--cy); }
.pos { font:900 22px 'Segoe UI',sans-serif; color:#fff; margin-top:6px; } .pen { font:700 12px 'Segoe UI',sans-serif; color:#ff6b61; min-height:14px; }
#minimap-container { position:absolute; bottom:22px; left:22px; width:170px; height:170px; background:var(--panel); border-radius:14px; border:2px solid #333; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.7); }
#minimap-canvas { width:100%; height:100%; }
#toast { position:absolute; top:112px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.78); border:1px solid #444; padding:8px 18px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap; }
#toast.show { opacity:1; }
#banner { position:absolute; top:34%; left:50%; transform:translate(-50%,-50%); font-size:40px; font-weight:900; letter-spacing:3px; text-shadow:0 0 22px rgba(0,0,0,.9); text-align:center; pointer-events:none; }
#banner small { display:block; font-size:18px; font-weight:600; letter-spacing:1px; margin-top:6px; }
#lights { position:absolute; top:20%; left:50%; transform:translateX(-50%); display:flex; gap:14px; background:rgba(0,0,0,.7); padding:14px 20px; border-radius:16px; }
#lights i { width:46px; height:46px; border-radius:50%; background:#2a1010; border:2px solid #444; display:block; }
#lights i.on { background:#ff1a1a; box-shadow:0 0 22px #ff1a1a; } #lights i.go { background:#26e060; box-shadow:0 0 22px #26e060; }
#fps { position:absolute; left:22px; top:14px; font:11px monospace; color:#7f8; opacity:.0; }
#hud.showfps #fps { opacity:.8; top:auto; bottom:200px; }

/* ---------- Dotykové ovládání ---------- */
#touch { position:absolute; inset:0; pointer-events:none; z-index:5; }
#touch .tb { position:absolute; pointer-events:auto; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.35); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; touch-action:none; backdrop-filter:blur(2px); }
#touch .tb.act { background:rgba(255,255,255,.35); }
#tb-left { left:18px; bottom:200px; width:78px; height:78px; } #tb-right { left:110px; bottom:200px; width:78px; height:78px; }
#tb-gas { right:18px; bottom:210px; width:96px; height:96px; background:rgba(52,199,89,.25); } #tb-brake { right:126px; bottom:200px; width:78px; height:78px; background:rgba(255,59,48,.25); }
#tb-up { right:18px; bottom:322px; width:56px; height:56px; font-size:15px; } #tb-down { right:84px; bottom:322px; width:56px; height:56px; font-size:15px; }
#tb-menu { right:14px; top:230px; width:52px; height:52px; font-size:14px; } #tb-cam { right:74px; top:230px; width:52px; height:52px; font-size:14px; }
#tb-tire { right:134px; top:230px; width:52px; height:52px; font-size:12px; opacity:.45; transition:opacity .2s; }
#tb-tire.pit-active { opacity:1; background:rgba(255,204,0,.3); border-color:#ffcc00; }

/* ---------- Hlavní nabídka ---------- */
#hub { position:fixed; inset:0; z-index:20; display:flex; background:linear-gradient(90deg,rgba(6,6,12,.94) 0%,rgba(6,6,12,.88) 44%,rgba(6,6,12,.15) 78%,rgba(6,6,12,0) 100%); touch-action:auto; }
.hub-panel { width:min(640px,100%); height:100%; display:flex; flex-direction:column; padding:20px 24px 16px; }
.hub-head { display:flex; justify-content:space-between; align-items:center; }
.logo { font-size:34px; font-weight:900; letter-spacing:4px; color:#fff; font-style:italic; }
.logo span { color:var(--red); }
#hub-profile { display:flex; align-items:center; gap:8px; font-size:14px; background:#1a1a24; border:1px solid var(--line); border-radius:20px; padding:5px 12px; cursor:pointer; }
.tabs { display:flex; gap:4px; margin:14px 0 10px; flex-wrap:wrap; }
.tabs button { background:#181822; color:var(--mut); border:1px solid var(--line); border-radius:8px; padding:8px 13px; font:600 13px inherit; cursor:pointer; }
.tabs button.active { background:var(--red); color:#fff; border-color:var(--red); }
#tab-content { flex:1; overflow-y:auto; padding-right:6px; touch-action:pan-y; }
#tab-content::-webkit-scrollbar { width:8px; } #tab-content::-webkit-scrollbar-thumb { background:#333; border-radius:4px; }
.hub-foot { display:flex; gap:10px; margin-top:12px; }
.btn { background:#22222e; color:var(--txt); border:2px solid #353545; border-radius:10px; padding:10px 18px; font:600 14px inherit; cursor:pointer; }
.btn:hover { border-color:#666; } .btn.sel { border-color:var(--cy); color:var(--cy); } .btn.sm { padding:6px 12px; font-size:12px; }
.btn.primary { background:var(--red); border-color:var(--red); color:#fff; font-weight:800; flex:1; font-size:17px; letter-spacing:2px; }
.btn[disabled] { opacity:.4; cursor:not-allowed; }
h3 { margin:16px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--mut); font-weight:700; }
details.acc { border:1px solid var(--line); border-radius:10px; margin:10px 0; background:#15151c; }
details.acc[open] { border-color:#35354a; }
details.acc > summary { list-style:none; cursor:pointer; padding:11px 14px; font-size:12px; text-transform:uppercase; letter-spacing:2px; color:var(--mut); font-weight:700; display:flex; justify-content:space-between; align-items:center; user-select:none; }
details.acc > summary::-webkit-details-marker { display:none; }
details.acc > summary::after { content:'▾'; font-size:11px; color:#50505f; transition:transform .15s; }
details.acc[open] > summary::after { transform:rotate(180deg); }
details.acc > summary:hover { color:#d7d9e5; }
details.acc .acc-body { padding:0 14px 14px; }
details.acc .acc-body > h3:first-child { margin-top:0; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .row .grow { flex:1; }
.card { background:#1a1a25; border:2px solid #2a2a3a; border-radius:12px; padding:10px 12px; cursor:pointer; }
.card:hover { border-color:#505068; } .card.active { border-color:var(--red); background:#241a1d; } .card.locked { opacity:.55; }
.card .nm { font-weight:700; font-size:15px; } .card .ds { font-size:12px; color:#9aa0b4; margin:2px 0 6px; } .card .meta { font-size:11px; color:var(--mut); }
.carcard { display:flex; gap:12px; align-items:center; }
.swatch { width:44px; height:44px; border-radius:9px; border:2px solid rgba(255,255,255,.25); flex:none; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:3px 14px; margin-top:6px; }
.stat { display:flex; align-items:center; gap:7px; font-size:11px; color:#bbb; } .stat span { width:70px; }
.stat .bar { height:6px; } .stat .bar div { height:100%; background:linear-gradient(90deg,#34c759,#ffcc00); }
.sl { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:13px; } .sl > label { width:150px; color:#c9cde0; } .sl input[type=range] { flex:1; } .sl output { width:96px; text-align:right; color:var(--cy); font-size:12px; }
input[type=range] { accent-color:var(--red); }
input[type=text], input[type=number], select { background:#14141c; color:var(--txt); border:1px solid #3a3a4c; border-radius:8px; padding:8px 10px; font:14px inherit; }
input[type=color] { width:46px; height:34px; border:1px solid #3a3a4c; border-radius:8px; background:#14141c; padding:2px; cursor:pointer; }
.chk { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:14px; cursor:pointer; } .chk input { width:18px; height:18px; accent-color:var(--red); }
.hint { font-size:12px; color:var(--mut); line-height:1.5; margin:4px 0; }
.tag { display:inline-block; font-size:10px; padding:1px 7px; border-radius:9px; background:#2a2a3a; color:#cfd3e6; margin-right:4px; }
.tag.gold { background:#7a5b00; color:#ffe27a; } .tag.silver { background:#4a4f5c; color:#e2e6f0; } .tag.bronze { background:#6b3d1c; color:#ffbd8a; } .tag.lock { background:#3a2020; color:#ff9b94; }
table.lb { width:100%; border-collapse:collapse; font-size:13px; } table.lb th { text-align:left; font-size:11px; color:var(--mut); text-transform:uppercase; padding:6px; border-bottom:1px solid var(--line); }
table.lb td { padding:7px 6px; border-bottom:1px solid #20202c; } table.lb tr.me td { background:rgba(255,59,48,.12); } table.lb td.t { font-family:monospace; color:var(--ye); }
.manual p, .manual li, .acc-body p, .acc-body li { font-size:13px; line-height:1.6; color:#cfd3e6; } .manual h4 { margin:14px 0 4px; color:#fff; font-size:14px; }
.av { font-size:22px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:#1f1f2b; border-radius:50%; border:2px solid #333; cursor:pointer; } .av.sel { border-color:var(--cy); }
.track-prev { width:100%; height:92px; background:#14141c; border-radius:8px; margin-bottom:6px; }
#results { position:fixed; inset:0; z-index:15; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); touch-action:auto; }
#results .box { background:#14141c; border:2px solid #333; border-radius:16px; padding:22px 26px; min-width:min(520px,94vw); max-height:90vh; overflow:auto; }
#results h2 { margin:0 0 10px; color:var(--red); letter-spacing:3px; }
@media (max-width:820px) {
  #controls-info { display:none; } #dash { right:8px; bottom:8px; padding:8px 12px; gap:10px; transform-origin:bottom right; transform:scale(.78); }
  #minimap-container { left:8px; bottom:8px; width:120px; height:120px; } #timer-box { top:8px; right:8px; width:176px; padding:8px 10px; transform-origin:top right; transform:scale(.88); }
  .tabs button { padding:7px 9px; font-size:12px; } .hub-panel { padding:12px; } .logo { font-size:26px; }
  .sl > label { width:100px; } .grid2 { grid-template-columns:1fr; }
  #tb-left { bottom:150px; left:10px; } #tb-right { bottom:150px; left:98px; } #tb-gas { bottom:160px; right:10px; } #tb-brake { bottom:150px; right:118px; } #tb-up { bottom:262px; right:10px; } #tb-down { bottom:262px; right:74px; }
  #tb-menu { top:200px; right:8px; } #tb-cam { top:200px; right:66px; } #tb-tire { top:200px; right:124px; width:46px; height:46px; }
}

</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="hud" class="off">
    <div id="controls-info">
        <kbd>W</kbd><kbd>S</kbd><kbd>A</kbd><kbd>D</kbd> / šipky jízda · <kbd>MEZERNÍK</kbd>/<kbd>SHIFT</kbd> řazení · <kbd>T</kbd> automat<br>
        <kbd>C</kbd> pohled · <kbd>R</kbd> na start · <kbd>P</kbd> pneu v boxu · <kbd>M</kbd> nabídka
    </div>
    <div id="shift-area">
        <div id="shiftlights"></div>
        <div id="shift-arrow" class="hidden"><div class="arrow">▲</div><div class="txt">PŘEŘAĎ</div></div>
    </div>
    <div id="timer-box">
        <div class="row"><span id="t-mode">VOLNÁ JÍZDA</span><span id="t-lapno"></span></div>
        <div id="t-lap">0:00.00</div>
        <div id="t-delta">Δ --</div>
        <div class="sub">Poslední <b id="t-last">--:--.--</b></div>
        <div class="sub">Nejlepší <b id="t-best">--:--.--</b></div>
        <div class="sectors" id="t-sectors"><span>S1 --</span><span>S2 --</span><span>S3 --</span></div>
        <div class="pos" id="t-pos"></div>
        <div class="pen" id="t-pen"></div>
        <div class="small sub" id="t-car"></div>
        <div class="small sub" id="t-opts"></div>
    </div>
    <div id="minimap-container"><canvas id="minimap-canvas" width="180" height="180"></canvas></div>
    <div id="dash">
        <div class="dash-col">
            <div class="label">Otáčky</div>
            <div id="rpm-bg"><div id="rpm-bar"></div><div id="rpm-red"></div></div>
            <div class="mini-row"><span>Pneu</span><div class="bar"><div id="wear-bar"></div></div><b id="wear-val">100%</b></div>
            <div class="mini-row"><span>Váha</span><div class="split"><div id="load-f"></div></div><b id="load-val">50/50</b></div>
            <div id="surface-tag">ASFALT</div>
        </div>
        <div class="gauge-box"><div class="label">km/h</div><div id="speed-val">0</div></div>
        <div class="gauge-box"><div class="label">Stupeň</div><div id="gear-val">1</div></div>
    </div>
    <div id="lights" class="hidden"><i></i><i></i><i></i><i></i><i></i></div>
    <div id="banner"></div>
    <div id="toast"></div>
    <div id="fps"></div>
</div>

<div id="touch" class="hidden">
    <div class="tb" id="tb-left">◀</div><div class="tb" id="tb-right">▶</div>
    <div class="tb" id="tb-gas">PLYN</div><div class="tb" id="tb-brake">BRZDA</div>
    <div class="tb" id="tb-up">＋</div><div class="tb" id="tb-down">－</div>
    <div class="tb" id="tb-cam">POHLED</div><div class="tb" id="tb-tire">PNEU</div><div class="tb" id="tb-menu">MENU</div>
</div>

<div id="results" class="hidden"><div class="box" id="results-box"></div></div>

<div id="hub">
    <div class="hub-panel">
        <div class="hub-head">
            <div class="logo">METO <span>Racing</span></div>
            <div id="hub-profile" title="Změnit profil"></div>
        </div>
        <div class="tabs" id="tabs">
            <button data-tab="race">Závod</button><button data-tab="garage">Garáž</button><button data-tab="board">Žebříček</button>
            <button data-tab="online">Online</button>
            <button data-tab="profile">Profil</button><button data-tab="settings">Nastavení</button><button data-tab="help">Návod</button>
        </div>
        <div id="tab-content"></div>
        <div class="hub-foot">
            <button class="btn primary" id="btn-start">START</button>
            <button class="btn" id="btn-resume">Pokračovat</button>
        </div>
    </div>
</div>

<script type="module">
// =====================================================================
// METO Racing – online vrstva (Google účet, globální žebříček, 1v1)
// Běží jako ES modul (import z Firebase CDN). Vystavuje window.metoDB.

import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import { getDatabase, ref, set, get, update, onValue, off, onDisconnect, remove, runTransaction } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyApAujYoM1eoipNGW5HI1W1ryn7F0fKdAU",
    authDomain: "meto-f237f.firebaseapp.com",
    projectId: "meto-f237f",
    databaseURL: "https://meto-f237f-default-rtdb.europe-west1.firebasedatabase.app",
    storageBucket: "meto-f237f.firebasestorage.app",
    messagingSenderId: "233531131302",
    appId: "1:233531131302:web:53eeb6c3f164c844cffb67",
    measurementId: "G-8Q9PCSFH5H"
};

let app, analytics, auth, provider, db, rtdb;
let fbReady = false, fbError = null;
try {
    app = initializeApp(firebaseConfig);
    try { analytics = getAnalytics(app); } catch (e) { /* analytics může selhat (blokovač reklam apod.), hra bez ní funguje dál */ }
    auth = getAuth(app);
    provider = new GoogleAuthProvider();
    db = getFirestore(app);
    rtdb = getDatabase(app);
    fbReady = true;
} catch (e) {
    console.error('Firebase se nepodařilo inicializovat:', e);
    fbError = e;
}

let currentUser = null;
let currentNickname = "";
let activeRoomRef = null;
let activeRoomCode = null;
let activeRole = null; // 'host' | 'guest'

function defaultNicknameFromGoogle(user) {

window.metoDB = {
    ready: () => fbReady,

    logoutGoogle: async () => {

            await setDoc(doc(db, "profiles", currentUser.uid), { nickname: clean, updatedAt: serverTimestamp() }, { merge: true });

    // uloží nejlepší čas hráče do globálního žebříčku (jen pokud je lepší než dosavadní)
    saveScore: async (carName, trackName, timeMs) => {

    createRoom: async (carId, trackId, totalLaps) => {

        const code = String(Math.floor(1000 + Math.random() * 9000));
        const roomRef = ref(rtdb, `rooms/${code}`);

        const roomRef = ref(rtdb, `rooms/${code}`);

            const snap = await get(roomRef);

            const data = snap.val();
            // OPRAVA: původní podmínka kontrolovala obsazenost jen když status už nebyl "waiting" -

            if (data.guest && data.guest.uid !== currentUser.uid) { alert("Místnost je už plná."); return null; }
            if (data.status !== "waiting" && (!data.guest || data.guest.uid !== currentUser.uid)) {
                alert("Tento závod už běží."); return null;
            }
            const nick = window.metoDB.getNickname();
            const guestRef = ref(rtdb, `rooms/${code}/guest`);

            await update(roomRef, { status: "countdown", startTime: Date.now() + 4000 });
            activeRoomRef = roomRef; activeRoomCode = code; activeRole = "guest";
            onDisconnect(guestRef).remove();
            onValue(roomRef, (s) => { if (window.onRoomUpdate) window.onRoomUpdate(s.val(), "guest", code); });
            return data.track || null;
        } catch (e) {
            console.error("Chyba při připojování do místnosti:", e);
            alert("Chyba připojení k místnosti: " + e.message);
            return null;
        }
    },
    syncPlayerState: (payload) => {
        if (!activeRoomRef || !activeRole || !activeRoomCode) return;
        const playerRef = ref(rtdb, `rooms/${activeRoomCode}/${activeRole}`);
        update(playerRef, { ...payload, ts: Date.now() }).catch(() => {});
    },
    startRaceAsHost: () => {
        if (!activeRoomRef || activeRole !== 'host') return;
        update(activeRoomRef, { status: 'racing' }).catch(() => {});
    },
    // OPRAVA: dřív kdo dojel DRUHÝ přepsal vítěze zápisem svého (horšího) času.
    // Teď je to atomická transakce, která zapíše výsledek jen tehdy, pokud místnost ještě není 'finished'.
    finishRoom: async (nick, totalMs) => {
        if (!activeRoomRef) return;
        try {
            await runTransaction(activeRoomRef, (room) => {
                if (!room) return room;
                if (room.status === 'finished') return; // už je rozhodnuto, nic neměníme
                room.status = 'finished';
                room.winnerNick = nick;
                room.winnerTime = totalMs;
                return room;
            });
        } catch (e) { console.error('Chyba při zápisu výsledku 1v1:', e); }
    },
    leaveRoom: async () => {
        if (activeRoomRef) {
            off(activeRoomRef);
            try {
                if (activeRole === "host") await remove(activeRoomRef);
                else if (activeRole === "guest" && activeRoomCode) await remove(ref(rtdb, `rooms/${activeRoomCode}/guest`));
            } catch (e) {}
        }
        activeRoomRef = null; activeRoomCode = null; activeRole = null;
        if (window.onRoomUpdate) window.onRoomUpdate(null, null, null);
    }
};

if (fbReady) {

        currentUser = user;

    });
} else {
    setTimeout(() => { if (window.onAuthUIUpdate) window.onAuthUIUpdate(null, ""); }, 0);
}

<script>
'use strict';
// ===================================================================
// METO Racing - LOGIKA 1/3: matematika, tratě, ideální stopa
// (bez závislosti na DOM / THREE, testovatelné v Node)
// ===================================================================
const G0 = 9.81;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth01 = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const smoothstep = (e0, e1, x) => smooth01((x - e0) / (e1 - e0));
function wrapPi(a) { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; }
function mulberry32(seed) {

    return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}

// ---------- Definice tratí ----------
// pts: řídicí body uzavřené křivky [x, z] v metrech; scale: měřítko; start je v pts[0] a jede se ve směru k pts[1].
const TRACKS = [

    },

        desc: 'Úzký a točivý okruh se sponami. Rozhoduje brzdění a trakce.',
        pts: [[0, 0], [0, -100], [0, -200], [40, -300], [130, -330], [210, -270], [200, -170], [120, -130], [90, -60],
            [150, 10], [250, 30], [330, 110], [290, 210], [190, 265], [90, 255], [25, 215], [0, 165], [0, 110], [0, 55]]
    },
    {
        id: 'valley', name: 'Údolí', halfW: 14, gravel: 10, pitSide: 1, kerbs: true, bank: 0, targetLen: 3900,
        desc: 'Dlouhá rovinka, spona a plynulé oblouky. Vyvážený okruh.',
        pts: [[0, 0], [0, -130], [0, -260], [-20, -420], [-140, -520], [-300, -500], [-380, -380], [-300, -260],
            [-170, -250], [-120, -140], [-180, -40], [-300, 40], [-300, 180], [-190, 255], [-70, 255], [0, 200], [0, 130], [0, 65]]
    },
    {
        id: 'gp', name: 'Grand Prix', halfW: 15, gravel: 10, pitSide: 1, kerbs: true, bank: 0, targetLen: 5200,
        desc: 'Nejdelší GT okruh: dlouhá rovinka, šikana, spona a rychlé oblouky.',
        pts: [[0, 0], [0, -225], [0, -450], [50, -560], [170, -600], [280, -540], [305, -440], [255, -360], [315, -300], [420, -290],
            [520, -200], [480, -80], [370, -40], [330, 60], [400, 170], [360, 290], [230, 340], [110, 300], [50, 230], [0, 160], [0, 80]]
    },
    {

        desc: 'NASCAR ovál s klopenými zatáčkami. Široký a velmi rychlý.',
        oval: { straight: 1400, radius: 300 }
    }
];

// ---------- Křivka: centripetální Catmull-Rom ----------
function crPoint(p0, p1, p2, p3, u) {
    const d01 = Math.pow(Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) || 1e-3, 0.5);
    const d12 = Math.pow(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) || 1e-3, 0.5);
    const d23 = Math.pow(Math.hypot(p3[0] - p2[0], p3[1] - p2[1]) || 1e-3, 0.5);
    const t0 = 0, t1 = d01, t2 = d01 + d12, t3 = d01 + d12 + d23;
    const t = lerp(t1, t2, u);
    const out = [0, 0];
    for (let k = 0; k < 2; k++) {
        const A1 = (t1 - t) / (t1 - t0) * p0[k] + (t - t0) / (t1 - t0) * p1[k];
        const A2 = (t2 - t) / (t2 - t1) * p1[k] + (t - t1) / (t2 - t1) * p2[k];
        const A3 = (t3 - t) / (t3 - t2) * p2[k] + (t - t2) / (t3 - t2) * p3[k];
        const B1 = (t2 - t) / (t2 - t0) * A1 + (t - t0) / (t2 - t0) * A2;
        const B2 = (t3 - t) / (t3 - t1) * A2 + (t - t1) / (t3 - t1) * A3;
        out[k] = (t2 - t) / (t2 - t1) * B1 + (t - t1) / (t2 - t1) * B2;
    }
    return out;
}

function denseFromControl(pts, scale) {
    const P = pts.map(p => [p[0] * scale, p[1] * scale]);
    const M = P.length, out = [];
    for (let i = 0; i < M; i++) {
        const p0 = P[(i - 1 + M) % M], p1 = P[i], p2 = P[(i + 1) % M], p3 = P[(i + 2) % M];
        const seg = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
        const n = Math.max(8, Math.ceil(seg / 2));
        for (let k = 0; k < n; k++) out.push(crPoint(p0, p1, p2, p3, k / n));
    }
    return out;
}

// Ovál (stadion) s přesnou geometrií. Start uprostřed spodní rovinky, jede se k zápornému z, zatáčky doleva.
function denseOval(straight, R) {
    const out = [];
    const h = straight / 2;
    // rovinka nahoru po x=0 od z=+h/2 do z=-h*1.5 (start je v z=0 => uprostřed delší strany)
    // Rozložení: start v (0,0). Rovinka 1: z od +straight/2 do -straight/2 (délka = straight), start uprostřed.
    const step = 2;
    for (let z = h; z > -h; z -= step) out.push([0, z]);
    // levá zatáčka (polokruh) kolem středu (-R, -h)
    const na = Math.ceil(Math.PI * R / step);
    for (let k = 0; k < na; k++) {
        const a = (k / na) * Math.PI; // 0..PI
        out.push([-R + R * Math.cos(a), -h - R * Math.sin(a)]);
    }
    // protější rovinka dolů po x=-2R
    for (let z = -h; z < h; z += step) out.push([-2 * R, z]);
    // druhá zatáčka kolem (-R, +h)
    for (let k = 0; k < na; k++) {
        const a = (k / na) * Math.PI;
        out.push([-R - R * Math.cos(a), h + R * Math.sin(a)]);
    }
    // otočení tak, aby první bod ležel uprostřed první rovinky (x=0, z=0)
    let bi = 0, bd = 1e9;
    for (let i = 0; i < out.length; i++) { const d = Math.hypot(out[i][0], out[i][1]); if (d < bd) { bd = d; bi = i; } }
    return out.slice(bi).concat(out.slice(0, bi));
}

function resampleClosed(dense, spacing) {
    const M = dense.length;
    const cum = new Float64Array(M + 1);
    for (let i = 0; i < M; i++) {
        const a = dense[i], b = dense[(i + 1) % M];
        cum[i + 1] = cum[i] + Math.hypot(b[0] - a[0], b[1] - a[1]);
    }
    const L = cum[M];
    const N = Math.max(60, Math.round(L / spacing));
    const ds = L / N;
    const xs = new Float64Array(N), zs = new Float64Array(N);
    let j = 0;
    for (let k = 0; k < N; k++) {
        const s = k * ds;
        while (j < M - 1 && cum[j + 1] < s) j++;
        const a = dense[j], b = dense[(j + 1) % M];
        const segL = cum[j + 1] - cum[j] || 1e-9;
        const u = (s - cum[j]) / segL;
        xs[k] = lerp(a[0], b[0], u);
        zs[k] = lerp(a[1], b[1], u);
    }
    return { xs, zs, N, ds, L };
}

// ---------- Stavba objektu trati ----------
function buildTrack(def) {
    let dense;
    if (def.oval) dense = denseOval(def.oval.straight, def.oval.radius);
    else {
        let sc = def.scale || 1;
        if (def.targetLen) {
            const d1 = denseFromControl(def.pts, 1);
            let l1 = 0;
            for (let i = 0; i < d1.length; i++) { const a = d1[i], b = d1[(i + 1) % d1.length]; l1 += Math.hypot(b[0] - a[0], b[1] - a[1]); }
            sc = def.targetLen / l1;
        }
        dense = denseFromControl(def.pts, sc);
    }

    // Posun tak, aby start (první bod) byl v (0,0)
    const ox = dense[0][0], oz = dense[0][1];
    dense = dense.map(p => [p[0] - ox, p[1] - oz]);

    const { xs, zs, N, ds, L } = resampleClosed(dense, 3.0);
    const T = {
        id: def.id, name: def.name, desc: def.desc, def, N, ds, L,
        x: xs, z: zs,
        tx: new Float64Array(N), tz: new Float64Array(N), nx: new Float64Array(N), nz: new Float64Array(N),
        kappa: new Float64Array(N),
        halfW: def.halfW, gravel: def.gravel, wallT: 0.9,
        wallIn: def.halfW + def.gravel,
        pitSide: def.pitSide || 1, hasKerbs: def.kerbs !== false, bank: def.bank || 0
    };
    for (let i = 0; i < N; i++) {
        const ip = (i + 1) % N, im = (i - 1 + N) % N;
        let tx = xs[ip] - xs[im], tz = zs[ip] - zs[im];
        const l = Math.hypot(tx, tz) || 1;
        tx /= l; tz /= l;
        T.tx[i] = tx; T.tz[i] = tz; T.nx[i] = -tz; T.nz[i] = tx;
    }
    // Znaménkové zakřivení (kladné = zatáčka doprava, střed zakřivení na straně +n)
    const kr = new Float64Array(N);
    for (let i = 0; i < N; i++) {
        const a = (i - 2 + N) % N, b = (i + 2) % N;
        const cross = T.tx[a] * T.tz[b] - T.tz[a] * T.tx[b];
        const dot = T.tx[a] * T.tx[b] + T.tz[a] * T.tz[b];
        kr[i] = Math.atan2(cross, dot) / (4 * ds);
    }
    for (let i = 0; i < N; i++) {
        let s = 0;
        for (let k = -2; k <= 2; k++) s += kr[(i + k + N) % N];
        T.kappa[i] = s / 5;
    }

    // Obrubníky v zatáčkách (poloměr < 170 m), krátké úseky zahodíme
    T.kerb = new Uint8Array(N);
    if (T.hasKerbs) {
        const kk = 1 / 170;
        for (let i = 0; i < N; i++) {
            let m = 0;
            for (let k = -4; k <= 4; k++) m += Math.abs(T.kappa[(i + k + N) % N]);
            T.kerb[i] = (m / 9) > kk ? 1 : 0;
        }
        // odstranění krátkých běhů
        let i0 = 0;
        while (i0 < N && T.kerb[i0] === 1) i0++;
        if (i0 < N) {
            let run = 0, startIdx = 0;
            for (let c = 1; c <= N; c++) {
                const i = (i0 + c) % N;
                if (T.kerb[i] === 1) { if (run === 0) startIdx = i; run++; }
                if (T.kerb[i] === 0 || c === N) {
                    if (run > 0 && run < 8) for (let q = 0; q < run; q++) T.kerb[(startIdx + q) % N] = 0;
                    run = 0;
                }
            }
        }
    }

    // Klopení (oval): sklon roste v zatáčkách, na rovinkách je 0
    T.bankTan = new Float32Array(N);
    T.sigma = 0;
    if (T.bank > 0) {
        let sum = 0;
        for (let i = 0; i < N; i++) sum += T.kappa[i];
        T.sigma = sum >= 0 ? 1 : -1;
        const tb = Math.tan(T.bank * Math.PI / 180);
        const raw = new Float64Array(N);
        for (let i = 0; i < N; i++) raw[i] = smoothstep(0.0006, 0.0022, Math.abs(T.kappa[i]));
        const W = 28; // vyhlazení ~170 m
        for (let i = 0; i < N; i++) {
            let s = 0;
            for (let k = -W; k <= W; k++) s += raw[(i + k + N) % N];
            T.bankTan[i] = tb * s / (2 * W + 1);
        }
    }

    // Pit lane na startovní rovince (klín rozšíření vozovky)
    T.pitMaxW = 9.5;
    T.pitW = new Float32Array(N);
    const rampIn = 90, full = 130, rampOut = 70, sA = -135;
    for (let i = 0; i < N; i++) {
        let s = i * ds; if (s > L / 2) s -= L; // s v rozsahu (-L/2, L/2]
        const a = smoothstep(0, 1, (s - sA) / rampIn);
        const b = 1 - smoothstep(0, 1, (s - (sA + rampIn + full)) / rampOut);
        T.pitW[i] = T.pitMaxW * a * (s < sA ? 0 : 1) * b * (s > sA + rampIn + full + rampOut ? 0 : 1);
    }
    T.pitBoxS = 25; // střed boxu
    T.pitBoxIdx = Math.round(T.pitBoxS / ds);
    T.pitLimit = 80 / 3.6;

    // Hranice, počáteční úhel
    let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
    for (let i = 0; i < N; i++) { minX = Math.min(minX, xs[i]); maxX = Math.max(maxX, xs[i]); minZ = Math.min(minZ, zs[i]); maxZ = Math.max(maxZ, zs[i]); }
    T.bounds = { minX, maxX, minZ, maxZ };
    T.startAngle = Math.atan2(-T.tx[0], -T.tz[0]);
    return T;
}

// ---------- Dotazy na polohu ----------
const LOC = { i: 0, lat: 0, d: 0 };
function locate(T, x, z, hint, win) {
    const N = T.N, X = T.x, Z = T.z;
    let best = 1e18, bi = 0;
    if (hint === undefined || hint < 0) {
        for (let i = 0; i < N; i++) {
            const dx = x - X[i], dz = z - Z[i], d = dx * dx + dz * dz;
            if (d < best) { best = d; bi = i; }
        }
    } else {
        const W = win || 30;
        for (let k = -W; k <= W; k++) {
            const i = (hint + k + N * 4) % N;
            const dx = x - X[i], dz = z - Z[i], d = dx * dx + dz * dz;
            if (d < best) { best = d; bi = i; }
        }
    }
    LOC.i = bi;
    LOC.lat = (x - X[bi]) * T.nx[bi] + (z - Z[bi]) * T.nz[bi];
    LOC.d = Math.sqrt(best);
    return LOC;
}

function heightAt(T, i, lat) {
    const b = T.bankTan[i];
    if (!b) return 0;
    const o = clamp(lat, -T.halfW, T.halfW);
    return b * (T.halfW - T.sigma * o);
}
function slopeAt(T, i, lat) { // sklon (dh/dlat) ve směru normály
    const b = T.bankTan[i];
    if (!b || Math.abs(lat) > T.halfW) return 0;
    return -T.sigma * b;
}

// 'asphalt' | 'kerb' | 'gravel' | 'pit'
function surfaceAt(T, i, lat) {
    const a = Math.abs(lat);
    const pw = T.pitW[i];
    const side = lat * T.pitSide;
    if (pw > 0.3 && side > T.halfW - 0.2 && side <= T.halfW + pw) return 'pit';
    if (a > T.halfW) return 'gravel';
    if (a > T.halfW - 2.2 && T.kerb[i]) return 'kerb';
    return 'asphalt';
}
// Zda je vůz v hlavní části boxové uličky (platí limit rychlosti)
function inPitLane(T, i, lat) {
    const pw = T.pitW[i];
    return pw > 5.5 && lat * T.pitSide > T.halfW + 0.3 && lat * T.pitSide <= T.halfW + pw;
}
function inPitBox(T, i, lat, along) {
    // along = vzdálenost od středu boxu v metrech (po trati)
    const side = lat * T.pitSide;
    return Math.abs(along) < 7 && side > T.halfW + 2.2 && side < T.halfW + T.pitMaxW - 0.8;
}
function unwrapDelta(i, prev, N) {
    let d = i - prev;
    if (d > N / 2) d -= N; else if (d < -N / 2) d += N;
    return d;
}

// ---------- Ideální stopa (minimální zakřivení, projektované Gauss-Seidel) ----------
function computeRacingLine(T, margin) {
    const N = T.N, ds = T.ds;
    const lim = T.halfW - margin;
    const STEP = 8;                      // hrubý uzel každých 8 vzorků (24 m)
    const M = Math.floor(N / STEP);
    const idx = new Int32Array(M);
    for (let k = 0; k < M; k++) idx[k] = Math.floor(k * N / M);
    const cx = new Float64Array(M), cz = new Float64Array(M), nx = new Float64Array(M), nz = new Float64Array(M);
    for (let k = 0; k < M; k++) { const i = idx[k]; cx[k] = T.x[i]; cz[k] = T.z[i]; nx[k] = T.nx[i]; nz[k] = T.nz[i]; }
    const o = new Float64Array(M);
    const qx = new Float64Array(M), qz = new Float64Array(M);
    for (let k = 0; k < M; k++) { qx[k] = cx[k]; qz[k] = cz[k]; }
    const res = (j, out) => { // druhá diference Q v uzlu j
        const a = (j - 1 + M) % M, b = (j + 1) % M;
        out[0] = qx[a] - 2 * qx[j] + qx[b];
        out[1] = qz[a] - 2 * qz[j] + qz[b];
    };
    const r0 = [0, 0], r1 = [0, 0], r2 = [0, 0];
    const iters = 6000;
    for (let it = 0; it < iters; it++) {
        for (let kk = 0; kk < M; kk++) {
            const k = (it & 1) ? M - 1 - kk : kk;
            const a = (k - 1 + M) % M, b = (k + 1) % M;
            res(a, r0); res(k, r1); res(b, r2);
            // gradient J podle o_k: (r_{k-1} - 2 r_k + r_{k+1}) . n_k, křivost 6
            const g = ((r0[0] - 2 * r1[0] + r2[0]) * nx[k] + (r0[1] - 2 * r1[1] + r2[1]) * nz[k]) / 6;
            let on = clamp(o[k] - g, -lim, lim);
            o[k] = on;
            qx[k] = cx[k] + nx[k] * on;
            qz[k] = cz[k] + nz[k] * on;
        }
    }
    // Interpolace offsetů na plné rozlišení (periodický Catmull-Rom)
    const off = new Float32Array(N);
    for (let i = 0; i < N; i++) {
        const f = i * M / N;
        const k1 = Math.floor(f) % M, u = f - Math.floor(f);
        const k0 = (k1 - 1 + M) % M, k2 = (k1 + 1) % M, k3 = (k1 + 2) % M;
        const p0 = o[k0], p1 = o[k1], p2 = o[k2], p3 = o[k3];
        const v = 0.5 * ((2 * p1) + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (-p0 + 3 * p1 - 3 * p2 + p3) * u * u * u);
        off[i] = clamp(v, -lim, lim);
    }
    const L = {
        off, N, margin,
        x: new Float64Array(N), z: new Float64Array(N),
        kappa: new Float64Array(N), ds: new Float64Array(N), cum: new Float64Array(N + 1)
    };
    for (let i = 0; i < N; i++) {
        L.x[i] = T.x[i] + T.nx[i] * off[i];
        L.z[i] = T.z[i] + T.nz[i] * off[i];
    }
    for (let i = 0; i < N; i++) {
        const ip = (i + 1) % N;
        L.ds[i] = Math.hypot(L.x[ip] - L.x[i], L.z[ip] - L.z[i]);
        L.cum[i + 1] = L.cum[i] + L.ds[i];
    }
    L.length = L.cum[N];
    // zakřivení čáry (Menger), vyhlazené
    const kraw = new Float64Array(N);
    for (let i = 0; i < N; i++) {
        const a = (i - 1 + N) % N, b = (i + 1) % N;
        const ax = L.x[i] - L.x[a], az = L.z[i] - L.z[a];
        const bx = L.x[b] - L.x[i], bz = L.z[b] - L.z[i];
        const cx2 = L.x[b] - L.x[a], cz2 = L.z[b] - L.z[a];
        const cr = ax * bz - az * bx;
        const den = Math.hypot(ax, az) * Math.hypot(bx, bz) * Math.hypot(cx2, cz2) || 1;
        kraw[i] = 2 * Math.abs(cr) / den;
    }
    for (let i = 0; i < N; i++) {
        let s = 0;
        for (let k = -3; k <= 3; k++) s += kraw[(i + k + N) % N];
        L.kappa[i] = s / 7;
    }
    return L;
}

function torqueCurve(eng, rn) {
    if (rn >= 1.0) return 0;
    if (rn < eng.peak) return eng.lo + (1 - eng.lo) * smoothstep(0, eng.peak, rn);
    if (rn < eng.knee) return 1;
    const x = (rn - eng.knee) / (1 - eng.knee);
    return 1 - eng.fall * x * x;
}
const stallFactor = rn => 0.25 + 0.75 * smoothstep(0, 0.2, rn);

function calibrateDrag(def) {
    const vr = def.gears.map(g => g / 3.6);
    const vt = def.topKmh / 3.6, last = vr.length - 1;
    const rn = Math.min(vt / vr[last], 0.999);
    const a = def.a1 * (vr[0] / vr[last]) * torqueCurve(def.eng, rn);
    return Math.max(1e-5, (a - ROLL) / (vt * vt));
}

const DEFAULT_TUNE = { gear: 0, tire: 'medium', df: 5, brake: 5, bias: 0 };

// Odvození parametrů fyziky z definice vozu a ladění
function deriveCar(def, tune) {
    tune = Object.assign({}, DEFAULT_TUNE, tune || {});
    const gm = 1 + 0.02 * tune.gear;            // -5..+5 => 0.90..1.10 (delší převody = vyšší max, horší zrychlení)
    const dfMul = 0.5 + 0.1 * tune.df;          // 0..10 => 0.5..1.5
    const dragMul = 1 + 0.035 * (tune.df - 5);
    const P = {
        def, id: def.id, tune,
        vr: def.gears.map(g => g / 3.6 * gm), nG: def.gears.length,
        a1: def.a1, eng: def.eng, drive: def.drive,
        kDrag: calibrateDrag(def) * dragMul,
        mu: def.mu, dfk: def.dfk * dfMul, L: def.L, f0: def.f0, wt: def.wt,
        lock: def.lock, steerRate: def.steerRate, overshoot: def.overshoot,
        brakeMul: def.brakeMul * (0.9 + 0.02 * tune.brake) * (1 - 0.012 * Math.abs(tune.bias)),
        bb: tune.bias,
        comp: COMPOUNDS[tune.tire] || COMPOUNDS.medium,
        pitLimit: 80 / 3.6,
        w: def.dims.wid, l: def.dims.len
    };
    P.vrRev = 7.0;
    P.corners = [[-P.w / 2, -P.l / 2], [P.w / 2, -P.l / 2], [-P.w / 2, P.l / 2], [P.w / 2, P.l / 2]];
    return P;
}

function makeWorld(T, opts) {
    opts = opts || {};
    return { track: T, rain: !!opts.rain, wearMul: opts.wearMul === undefined ? 1 : opts.wearMul };
}

function newCarState(T, s, off, angleBias) {
    const i = ((Math.round(s / T.ds) % T.N) + T.N) % T.N;
    const S = {
        x: T.x[i] + T.nx[i] * off, z: T.z[i] + T.nz[i] * off,
        angle: Math.atan2(-T.tx[i], -T.tz[i]) + (angleBias || 0), velAngle: 0, speed: 0,
        gear: 1, manual: false, steer: 0, thr: 0, brk: 0, rn: 0.1, rnRaw: 0, shiftTimer: 0, revTimer: 0,
        slip: 0, aLong: 0, aLongS: 0, aLat: 0, fLoad: 0.5, wear: 0, tireGrip: 1,
        surface: 'asphalt', idx: i, lat: off, inPit: false, hold: false, impact: 0, spin: 0, over: false,
        prog: s, // postup po trati v metrech (nezabalený)
        wall: 0
    };

}

function shiftGear(S, P, dir) {
    if (S.gear < 1) return false;
    if (dir > 0) {
        if (S.gear >= P.nG) return false;
        S.gear++; S.shiftTimer = 0.14; return true;
    }
    if (S.gear <= 1) return false;
    if (Math.max(0, S.speed) > P.vr[S.gear - 2] * 1.0) { S.overRev = 0.8; return false; }
    S.gear--; S.shiftTimer = 0.14; return true;
}

function tireGripNow(P, W, wear) {
    const c = P.comp;
    return (W.rain ? c.wetGrip : c.grip) * (1 - 0.30 * Math.pow(wear, 1.5) - (wear > 0.8 ? (wear - 0.8) * 0.6 : 0));
}

// ---------- Kolize s bariérami ----------
function collideWalls(S, P, T) {
    const limit = T.wallIn - 0.1;
    let hit = false, hnx = 0, hnz = 0;
    const ca = Math.cos(S.angle), sa = Math.sin(S.angle);
    for (let pass = 0; pass < 2; pass++) {
        for (let c = 0; c < 4; c++) {
            const cx = P.corners[c][0], cz = P.corners[c][1];
            const wx = S.x + cx * ca + cz * sa;
            const wz = S.z - cx * sa + cz * ca;
            const q = locate(T, wx, wz, S.idx, 40);
            const over = q.d - limit;
            if (over > 0) {
                let nx = wx - T.x[q.i], nz = wz - T.z[q.i];
                const l = Math.hypot(nx, nz) || 1;
                nx /= l; nz /= l;
                S.x -= nx * (over + 0.02);
                S.z -= nz * (over + 0.02);
                hit = true; hnx = nx; hnz = nz;
            }
        }
    }
    if (!hit) return;
    // Rychlostní vektor, odraz od stěny + tření
    const dirx = -Math.sin(S.velAngle), dirz = -Math.cos(S.velAngle);
    let vx = dirx * S.speed, vz = dirz * S.speed;
    const vn = vx * hnx + vz * hnz;
    if (vn > 0) {
        const tx = vx - vn * hnx, tz = vz - vn * hnz;
        const fr = 1 - 0.22 * Math.min(1, vn / 8);
        vx = tx * fr - 0.18 * vn * hnx;
        vz = tz * fr - 0.18 * vn * hnz;
        const mag = Math.hypot(vx, vz);
        const sign = S.speed >= 0 ? 1 : -1;
        const strength = vn;
        S.impact = Math.max(S.impact, strength);
        if (mag > 0.05) {
            const na = sign > 0 ? Math.atan2(-vx, -vz) : Math.atan2(vx, vz);
            const dA = wrapPi(na - S.velAngle);
            S.velAngle += dA;
            S.angle += wrapPi(S.velAngle - S.angle) * 0.35;
        }
        S.speed = sign * mag;
        S.wall = 0.4;
    }
}

// ---------- Jeden fyzikální krok ----------
function stepCar(S, P, inp, W, dt) {
    const T = W.track;
    const q = locate(T, S.x, S.z, S.idx, 40);

    S.surface = surf;
    S.inPit = inPitLane(T, q.i, q.lat);
    S.impact = 0;
    if (S.overRev > 0) S.overRev -= dt;
    if (S.wall > 0) S.wall -= dt;

    // --- vyhlazení vstupů
    const hold = S.hold;
    const steerIn = hold ? 0 : inp.steer;
    const rate = (Math.abs(steerIn) > Math.abs(S.steer) && steerIn * S.steer >= 0) ? P.steerRate : P.steerRate * 1.9;
    S.steer += clamp(steerIn - S.steer, -rate * dt, rate * dt);

    // --- vpřed / zpátečka
    if (!hold) {
        if (S.gear >= 1) {
            if (inp.brake > 0.5 && inp.throttle < 0.1 && S.speed < 0.6) { S.revTimer += dt; if (S.revTimer > 0.35) { S.gear = -1; S.revTimer = 0; } }
            else S.revTimer = 0;
        } else if (S.gear === -1) {
            if (inp.throttle > 0.5 && inp.brake < 0.1 && Math.abs(S.speed) < 0.8) { S.gear = 1; }

    }
    let thrIn = hold ? 0 : inp.throttle, brkIn = hold ? 1 : inp.brake;
    if (S.gear === -1 && !hold) { thrIn = inp.brake; brkIn = inp.throttle; }
    S.thr += clamp(thrIn - S.thr, -7 * dt, 5 * dt);
    S.brk += clamp(brkIn - S.brk, -10 * dt, 8 * dt);

    // --- automatická převodovka
    if (!S.manual && S.gear > 0 && S.shiftTimer <= 0 && !hold) {
        const rn = Math.max(0, S.speed) / P.vr[S.gear - 1];
        if (rn > 0.95 && S.gear < P.nG) { S.gear++; S.shiftTimer = 0.22; }
        else if (S.gear > 1 && Math.max(0, S.speed) < P.vr[S.gear - 2] * 0.74) { S.gear--; S.shiftTimer = 0.22; }
    }
    if (S.shiftTimer > 0) S.shiftTimer -= dt;

    const v = S.speed, vabs = Math.abs(v);

    // --- povrch, přilnavost, přenos váhy
    let sg = SURF_GRIP[surf];
    if (W.rain && surf === 'gravel') sg *= 0.85;
    S.tireGrip = tireGripNow(P, W, S.wear);
    const bankBonus = (surf === 'gravel') ? 0 : G0 * 1.8 * T.bankTan[q.i];

    S.aLongS += (S.aLong - S.aLongS) * Math.min(1, dt / 0.12);

    S.fLoad = f;
    const gf = Math.pow(clamp(f / P.f0, 0.55, 1.6), 0.8);
    let gr = Math.pow(clamp((1 - f) / (1 - P.f0), 0.45, 1.6), 0.8);

    const load = P.drive === 'rwd' ? gr : (P.drive === 'fwd' ? gf : 0.5 * (gf + gr));

    // --- podélná dynamika
    let aDrive = 0, spin = 0, rnSp = 0, rnEff = 0;
    if (S.gear > 0) {
        const g = S.gear - 1, vr = P.vr[g];
        rnSp = Math.max(0, v) / vr;

        if (S.shiftTimer <= 0 && rnSp < 1.0 && !hold) {
            let a = P.a1 * (P.vr[0] / vr) * torqueCurve(P.eng, rnEff) * (g > 0 ? stallFactor(rnEff) : 1) * S.thr;

        const rn = Math.max(0, -v) / P.vrRev;
        rnSp = rn; rnEff = Math.max(rn, 0.4 * S.thr);
        if (rn < 1 && !hold) aDrive = -Math.min(P.a1 * 0.3 * (1 - rn) * S.thr, tractionCap);
    }
    S.spin = spin;
    const aBrk = S.brk * 0.95 * gripBase * P.brakeMul;
    let aEb = 0;
    if (S.gear > 0 && S.shiftTimer <= 0 && v > 0) {
        aEb = (1 - S.thr) * (0.6 + 1.8 * rnSp) * (0.5 + 0.5 * P.vr[0] / P.vr[S.gear - 1]);
    }
    let aExtra = 0;
    if (surf === 'gravel') aExtra = 2.5 + 0.06 * vabs;
    else if (surf === 'kerb') aExtra = 0.25;

    // --- boční dynamika (jednostopý model s opožděným směrem rychlosti)
    const lonUse = Math.min(1, Math.max(Math.abs(aDrive), aBrk) / Math.max(gripBase, 0.1));
    const latScale = Math.sqrt(1 - 0.55 * lonUse * lonUse);
    const spinF = 1 / (1 + 0.9 * spin);
    const aFront = gripBase * gf * latScale + bankBonus;
    const aRear = gripBase * gr * latScale * spinF + bankBonus;
    const aNom = muEff * G0 * P.overshoot + bankBonus;
    const maxDelta = Math.min(P.lock, aNom * P.L / Math.max(v * v, 1.0));
    const delta = S.steer * maxDelta;
    let yaw = (v / P.L) * Math.tan(delta);
    const yawMax = (aFront * 1.08) / Math.max(vabs, 2);
    yaw = clamp(yaw, -yawMax, yawMax);
    yaw /= 1 + Math.pow(Math.abs(S.slip) / 0.45, 2);
    S.angle += yaw * dt;

    let slip = wrapPi(S.angle - S.velAngle);
    let vrate;
    if (vabs < 2.5) vrate = clamp(slip * 12, -6, 6);
    else vrate = clamp(8 * slip, -aRear / vabs, aRear / vabs);
    S.velAngle += vrate * dt;
    S.aLat = vabs * vrate;
    slip = wrapPi(S.angle - S.velAngle);
    const SL = 1.15;
    if (slip > SL) { S.angle = S.velAngle + SL; slip = SL; }
    else if (slip < -SL) { S.angle = S.velAngle - SL; slip = -SL; }
    S.slip = slip;
    S.angle = wrapPi(S.angle); S.velAngle = wrapPi(S.velAngle);
    const aScrub = Math.abs(S.aLat) * Math.abs(Math.sin(slip));

    // --- integrace rychlosti
    let nv = v + aDrive * dt;
    const dec = P.kDrag * v * v + ROLL + aBrk + aEb + aExtra + aScrub;
    if (nv > 0) nv = Math.max(0, nv - dec * dt);
    else if (nv < 0) nv = Math.min(0, nv + dec * dt);
    if (S.inPit && nv > P.pitLimit) nv = Math.max(P.pitLimit, nv - 18 * dt);
    if (hold) nv = 0;
    S.aLong = clamp((nv - v) / dt, -1.8 * G0, 1.8 * G0);
    S.speed = nv;

    // --- pohyb s podkroky a kolizemi
    const steps = Math.max(1, Math.ceil(Math.abs(nv) * dt / 0.8));
    const sdt = dt / steps;
    for (let k = 0; k < steps; k++) {
        S.x += -Math.sin(S.velAngle) * S.speed * sdt;
        S.z += -Math.cos(S.velAngle) * S.speed * sdt;
        collideWalls(S, P, T);
    }

    // --- otáčky (zobrazení)
    let rnT = 0.08;
    if (S.gear !== 0) rnT = Math.max(rnEff, 0.08 + 0.1 * S.thr);
    if (S.shiftTimer > 0) rnT = Math.max(0.08, rnT * 0.8);
    rnT = Math.min(1, rnT);
    S.rn += (rnT - S.rn) * (1 - Math.exp(-dt * 14));
    S.rnRaw = rnSp;

    // --- opotřebení pneumatik
    if (W.wearMul > 0) {
        const gLat = Math.abs(S.aLat) / G0, gLon = Math.abs(S.aLongS) / G0;
        const slideT = Math.max(0, Math.abs(slip) - 0.07) * Math.min(1, vabs / 15);
        const r = 0.00026 + 0.0006 * gLat * gLat + 0.0004 * gLon * gLon + 0.02 * slideT + 0.006 * spin;
        S.wear = Math.min(1, S.wear + r * P.comp.wear * W.wearMul * dt);
    }

    // --- postup po trati
    const di = unwrapDelta(q.i, S.lastIdx === undefined ? q.i : S.lastIdx, T.N);
    S.lastIdx = q.i;
    S.prog += di * T.ds;
    S.off = (surf === 'gravel' && Math.abs(q.lat) > T.halfW + 1.0 && surf !== 'pit');
}

// ---------- Výkon: akcelerační simulace (max. rychlost, 0-100) ----------
function accelSim(P, W) {
    W = W || { rain: false };
    let v = 0, gear = 1, t = 0, t100 = null, t200 = null, a = 1;
    const dt = 0.02;
    while (t < 90 && (a > 0.01 || t < 3)) {
        const g = gear - 1, vr = P.vr[g];
        let rn = v / vr;
        if (rn > 0.97 && gear < P.nG) { gear++; t += 0.15; continue; }
        const rnEff = g === 0 ? Math.max(rn, 0.55) : rn;
        const gripBase = P.mu * (1 + P.dfk * v * v) * G0 * tireGripNow(P, { rain: false }, 0);
        const cap = 0.85 * gripBase * 1.1;
        let d = rn < 1 ? Math.min(P.a1 * (P.vr[0] / vr) * torqueCurve(P.eng, rnEff) * (g > 0 ? stallFactor(rnEff) : 1), cap) : 0;
        a = d - P.kDrag * v * v - ROLL;
        v = Math.max(0, v + a * dt);
        t += dt;
        if (t100 === null && v >= 100 / 3.6) t100 = t;
        if (t200 === null && v >= 200 / 3.6) t200 = t;
    }
    return { top: v * 3.6, t100: t100, t200: t200 };
}

// ---------- Profil rychlosti podél ideální stopy ----------
function buildSpeedProfile(T, line, P, W) {
    const N = T.N;
    W = W || { rain: false };
    const sim = accelSim(P, W);
    const vTop = sim.top / 3.6 * 0.995;
    const tireN = tireGripNow(P, W, 0);
    const muW = P.mu * tireN;
    // tabulka zrychlení a brzdění
    const VM = Math.ceil(vTop + 5), KS = 0.5, K = Math.ceil(VM / KS) + 2;
    const accTab = new Float64Array(K), brkTab = new Float64Array(K);
    for (let k = 0; k < K; k++) {
        const v = k * KS;
        const gripBase = P.mu * (1 + P.dfk * v * v) * G0 * tireN;
        let best = 0;
        for (let g = 0; g < P.nG; g++) {
            const rn = v / P.vr[g];
            if (rn >= 0.99) continue;
            const rnEff = g === 0 ? Math.max(rn, 0.55) : rn;
            const a = Math.min(P.a1 * (P.vr[0] / P.vr[g]) * torqueCurve(P.eng, rnEff) * (g > 0 ? stallFactor(rnEff) : 1), 0.85 * gripBase * 1.05);
            if (a > best) best = a;
        }
        accTab[k] = Math.max(0.2, best - P.kDrag * v * v - ROLL);
        brkTab[k] = 0.88 * 0.95 * gripBase * P.brakeMul + P.kDrag * v * v + ROLL;
    }
    const at = (tab, v) => { const f = Math.min(v / KS, K - 2); const k = Math.floor(f); return tab[k] + (tab[k + 1] - tab[k]) * (f - k); };
    const vt = new Float64Array(N), latCap = new Float64Array(N);
    for (let i = 0; i < N; i++) {
        const k = Math.max(line.kappa[i], 1e-5);
        const bonus = G0 * 1.8 * T.bankTan[i];
        const den = k - G0 * muW * P.dfk;
        let v2 = den > 1e-7 ? (G0 * muW + bonus) / den : 1e9;
        vt[i] = Math.min(Math.sqrt(v2) * 0.96, vTop);
    }
    const useRatio = (i, v) => {
        const lim = (muW * (1 + P.dfk * v * v) * G0 + G0 * 1.8 * T.bankTan[i]);
        return Math.min(1, v * v * line.kappa[i] / lim);
    };
    for (let pass = 0; pass < 3; pass++) {
        for (let i = N - 1; i >= 0; i--) {
            const j = (i + 1) % N, vj = vt[j];
            const u = useRatio(j, vj);
            const aB = at(brkTab, vj) * Math.sqrt(Math.max(0.2, 1 - u * u));
            const allowed = Math.sqrt(vj * vj + 2 * aB * line.ds[i]);
            if (allowed < vt[i]) vt[i] = allowed;
        }
        for (let i = 0; i < N; i++) {
            const j = (i + 1) % N, vi = vt[i];
            const u = useRatio(i, vi);
            const a = at(accTab, vi) * Math.sqrt(Math.max(0.2, 1 - u * u));
            const nv = Math.sqrt(vi * vi + 2 * a * line.ds[i]);
            if (nv < vt[j]) vt[j] = nv;
        }
    }
    let lap = 0;
    for (let i = 0; i < N; i++) { const j = (i + 1) % N; lap += line.ds[i] / Math.max(1, 0.5 * (vt[i] + vt[j])); }
    return { vt, lapTime: lap, top: sim.top, t100: sim.t100, accAt: v => at(accTab, v), brkAt: v => at(brkTab, v) };
}

// METO Racing - LOGIKA 3/3: AI soupeři, kontakty, pořadí
// ===================================================================
const AI_NAMES = ['Novák', 'Svoboda', 'Dvořák', 'Černý', 'Procházka', 'Kučera', 'Veselý', 'Horák', 'Němec', 'Marek', 'Pospíšil', 'Pokorný'];
const AI_COLORS = ['#e63946', '#2a9dff', '#f4c20d', '#31c48d', '#a855f7', '#ff7a00', '#f472b6', '#e5e7eb', '#14b8a6', '#84cc16'];

function aiParams(d01, rng) {
    d01 = clamp(d01, 0, 1);
    return {
        pace: (0.78 + 0.22 * d01) * (1 + (rng() - 0.5) * 0.03),
        wAmp: 3.2 * Math.pow(1 - d01, 1.5) + 0.2,
        brakeErr: 45 * (1 - d01) + 3,
        mistakeRate: 0.025 * (1 - d01)
    };
}

function newAI(T, prof, P, grid, d01, rng, name, color) {
    const prm = aiParams(d01, rng);
    const i = ((Math.round(grid.s / T.ds) % T.N) + T.N) % T.N;
    const A = {
        P, prof, name, color, rng, d01,
        u: grid.s / T.ds, v: 0, lat: grid.lat, bias: 0, errOff: 0, mistake: 0, mistakeOff: 0, hitT: 0,
        ph1: rng() * 6.28, ph2: rng() * 6.28, t: 0, brkT: 0, brkShift: 0,
        pace: prm.pace, wAmp: prm.wAmp, brakeErr: prm.brakeErr, mistakeRate: prm.mistakeRate,
        x: T.x[i] + T.nx[i] * grid.lat, z: T.z[i] + T.nz[i] * grid.lat,
        angle: Math.atan2(-T.tx[i], -T.tz[i]), prog: grid.s, finished: false, finishTime: null, bestLap: Infinity, laps: 0,
        roll: 0, idx: i
    };
    return A;
}

function stepAI(A, T, line, others, dt, go) {
    const N = T.N, rng = A.rng;
    A.t += dt;
    const fl = Math.floor(A.u);
    const i = ((fl % N) + N) % N, j = (i + 1) % N, fr = A.u - fl;
    A.idx = i;

    // náhodné odchylky brzdných bodů (každých pár vteřin znovu)
    A.brkT -= dt;
    if (A.brkT <= 0) { A.brkT = 1.5 + rng() * 2.5; A.brkShift = (rng() * 2 - 1) * A.brakeErr; }
    // občasná chyba (pomalejší, vybočení)
    if (A.mistake > 0) { A.mistake -= dt; if (A.mistake <= 0) A.mistakeOff = 0; }
    else if (rng() < A.mistakeRate * dt) {
        A.mistake = 1.5 + rng() * 1.5;
        A.mistakeOff = (rng() < 0.5 ? -1 : 1) * (3 + rng() * 4);
    }
    if (A.hitT > 0) A.hitT -= dt;

    const shift = Math.round(A.brkShift / T.ds);
    const vt = A.prof.vt;
    let vRef = vt[(i + shift + N * 4) % N] * A.pace;
    if (A.mistake > 0) vRef *= 0.65;
    if (A.hitT > 0) vRef *= 0.9;
    const vsafe = vt[i] * A.pace;

    // provoz před AI
    let biasT = 0;
    for (let k = 0; k < others.length; k++) {
        const o = others[k];
        if (o === A) continue;
        let dp = o.prog - A.prog;
        dp = ((dp % T.L) + T.L) % T.L;
        if (dp > 0.5 && dp < 26) {
            const dl = o.lat - A.lat;
            if (Math.abs(dl) < 2.8) {
                if (dp < 13) vRef = Math.min(vRef, Math.max(0, o.v) * 0.985);
                biasT = (A.lat >= o.lat ? 1 : -1) * 3.2;
                if (A.lat + biasT > T.halfW - 2) biasT = -3.2; else if (A.lat + biasT < -T.halfW + 2) biasT = 3.2;
            }
        }
    }
    A.bias += clamp(biasT - A.bias, -1.8 * dt, 1.8 * dt);

    if (!go) vRef = 0;
    if (A.v < vRef) A.v = Math.min(vRef, A.v + A.prof.accAt(A.v) * 0.93 * dt);
    else A.v = Math.max(vRef, A.v - A.prof.brkAt(A.v) * 0.9 * dt);
    const over = Math.max(0, A.v / Math.max(vsafe, 1) - 1.03);
    if (over > 0) A.v -= over * A.v * 1.5 * dt;
    const outSign = -Math.sign(T.kappa[i]);
    const eT = outSign * Math.min(9, over * 70);
    A.errOff += (eT - A.errOff) * Math.min(1, dt * 2.5);

    const lineOff = lerp(line.off[i], line.off[j], fr);
    const wander = A.wAmp * (Math.sin(A.t * 0.37 + A.ph1) + 0.6 * Math.sin(A.t * 0.93 + A.ph2)) / 1.6;
    A.lat = clamp(lineOff + A.bias + wander + A.errOff + A.mistakeOff, -(T.halfW + 1.0), T.halfW + 1.0);

    const dsEff = clamp(T.ds * (1 - T.kappa[i] * A.lat), T.ds * 0.6, T.ds * 1.4);
    A.u += A.v * dt / dsEff;
    A.prog = A.u * T.ds;

    // poloha a směr
    const fl2 = Math.floor(A.u), i2 = ((fl2 % N) + N) % N, j2 = (i2 + 1) % N, f2 = A.u - fl2;
    const nxx = lerp(T.nx[i2], T.nx[j2], f2), nzz = lerp(T.nz[i2], T.nz[j2], f2);
    const nl = Math.hypot(nxx, nzz) || 1;
    const px = A.x, pz = A.z;
    A.x = lerp(T.x[i2], T.x[j2], f2) + nxx / nl * A.lat;
    A.z = lerp(T.z[i2], T.z[j2], f2) + nzz / nl * A.lat;
    if (A.v > 1) {
        const ta = Math.atan2(-(A.x - px), -(A.z - pz));
        A.angle = wrapPi(A.angle + wrapPi(ta - A.angle) * Math.min(1, dt * 10));
    } else {
        const ta = Math.atan2(-T.tx[i2], -T.tz[i2]);
        A.angle = wrapPi(A.angle + wrapPi(ta - A.angle) * Math.min(1, dt * 4));
    }
    A.idx = i2;
}

// Kontakt hráče s AI (elipsa v souřadnicích AI): vrací sílu nárazu
function resolveContact(S, P, A, dt) {
    const dx = S.x - A.x, dz = S.z - A.z;
    if (dx * dx + dz * dz > 36) return 0;
    const ca = Math.cos(A.angle), sa = Math.sin(A.angle);
    const lx = dx * ca - dz * sa;           // do lokálních souřadnic AI (x doprava, z dozadu)
    const lz = dx * sa + dz * ca;
    const a = 2.15, b = 4.7;
    const sNorm = Math.sqrt((lx / a) * (lx / a) + (lz / b) * (lz / b));
    if (sNorm >= 1) return 0;
    const d = Math.hypot(dx, dz) || 1;
    const push = (1 - sNorm) * 1.4;
    S.x += dx / d * push;
    S.z += dz / d * push;
    const vx = -Math.sin(S.velAngle) * S.speed, vz = -Math.cos(S.velAngle) * S.speed;
    const rel = (vx * -dx / d + vz * -dz / d) - (-Math.sin(A.angle) * A.v * (-dx / d) + -Math.cos(A.angle) * A.v * (-dz / d));
    if (rel > 0.5) {
        S.speed -= Math.sign(S.speed || 1) * Math.min(Math.abs(S.speed) * 0.35, rel * 0.5);
        A.hitT = 0.6;
    }
    return Math.max(0, rel);
}

function computeStandings(racers) {
    return racers.slice().sort((p, q) => q.prog - p.prog);
}

// METO Racing - ÚLOŽIŠTĚ: profily, nastavení, duchové, medaile

const STORE_KEY = 'meto.racing.v1';
const AVATARS = ['🏎️', '🚗', '🏁', '🦊', '🐺', '🦅', '🔥', '⚡', '🚀', '👑', '🐉', '🎯'];
const MEM = {}; // záloha, když localStorage není dostupný

const QUALITY_PRESETS = {
    low:    { shadows: false, shadowSize: 1024, scale: 0.75, scenery: 0, maxAI: 3, rain: 300, far: 380, fpsCap: 30, aa: false, lamps: false, minimap: true },
    medium: { shadows: true,  shadowSize: 1024, scale: 1.0,  scenery: 1, maxAI: 5, rain: 700, far: 620, fpsCap: 60, aa: true,  lamps: true,  minimap: true },
    high:   { shadows: true,  shadowSize: 2048, scale: 1.0,  scenery: 2, maxAI: 7, rain: 1200, far: 950, fpsCap: 0,  aa: true,  lamps: true,  minimap: true }
};

function storageGet(k) { try { const v = localStorage.getItem(k); return v === null ? (MEM[k] === undefined ? null : MEM[k]) : v; } catch (e) { return MEM[k] === undefined ? null : MEM[k]; } }
function storageSet(k, v) { MEM[k] = v; try { localStorage.setItem(k, v); } catch (e) { } }
function storageDel(k) { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) { } }

function isTouchDevice() {
    try { return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0); } catch (e) { return false; }
}

const store = {
    v: 1, active: null, profiles: {},
    settings: {
        quality: isTouchDevice() ? 'low' : 'medium',
        q: null,          // vlastní kvalita (kopie presetu s úpravami)
        touch: 'auto',    // auto | on | off
        volume: 60, line: true, ghost: true, sectors: true, penalties: true, showFps: false, help: false
    },
    cfg: { mode: 'free', track: 'mini', car: 'apex', laps: 3, ai: 5, aiDiff: 50, weather: 'dry', time: 'day', grid: 'last', wear: 1, manual: false }
};

function loadStore() {
    try {
        const raw = storageGet(STORE_KEY);
        if (raw) {
            const s = JSON.parse(raw);
            if (s && s.v === 1) {
                store.active = s.active; store.profiles = s.profiles || {};
                Object.assign(store.settings, s.settings || {});
                Object.assign(store.cfg, s.cfg || {});
            }
        }
    } catch (e) { }
    if (!Object.keys(store.profiles).length) createProfile('Hráč 1', AVATARS[0]);
    if (!store.profiles[store.active]) store.active = Object.keys(store.profiles)[0];
    for (const id in store.profiles) normalizeProfile(store.profiles[id]);
}
function saveStore() {
    try { storageSet(STORE_KEY, JSON.stringify({ v: 1, active: store.active, profiles: store.profiles, settings: store.settings, cfg: store.cfg })); } catch (e) { }
}
function normalizeProfile(p) {
    p.unlocked = p.unlocked || {}; p.unlocked.apex = true;
    p.tune = p.tune || {}; p.look = p.look || {}; p.bests = p.bests || {}; p.medals = p.medals || {};
    p.stats = Object.assign({ laps: 0, km: 0, races: 0, wins: 0, pits: 0 }, p.stats || {});
}
function createProfile(name, avatar) {
    const id = 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36);
    store.profiles[id] = { id, name: (name || 'Hráč').slice(0, 16), avatar: avatar || AVATARS[0], created: Date.now() };
    normalizeProfile(store.profiles[id]);
    store.active = id;
    saveStore();
    return store.profiles[id];
}
function deleteProfile(id) {
    if (Object.keys(store.profiles).length <= 1) return false;
    delete store.profiles[id];
    for (const k of Object.keys(MEM)) if (k.indexOf('meto.g.' + id + '.') === 0) storageDel(k);
    try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && k.indexOf('meto.g.' + id + '.') === 0) localStorage.removeItem(k); } } catch (e) { }
    if (store.active === id) store.active = Object.keys(store.profiles)[0];
    saveStore();
    return true;
}
const profile = () => store.profiles[store.active];

// ---------- kvalita ----------
function getQuality() {
    const s = store.settings;
    if (s.quality === 'custom' && s.q) return Object.assign({}, QUALITY_PRESETS.medium, s.q);
    return Object.assign({}, QUALITY_PRESETS[s.quality] || QUALITY_PRESETS.medium);
}

// ---------- ladění a vzhled aut (per profil) ----------
function getTune(carId) { return Object.assign({}, DEFAULT_TUNE, profile().tune[carId] || {}); }
function getLook(carId) {
    const def = CARS.find(c => c.id === carId);
    return Object.assign({}, def.look, profile().look[carId] || {});
}

// ---------- duchové (Int16 -> base64) ----------
function ghostKey(trackId, carId) { return 'meto.g.' + store.active + '.' + trackId + '.' + carId; }
function encodeGhost(rec) {
    const n = rec.length;
    const a = new Int16Array(n);
    for (let i = 0; i < n; i++) a[i] = rec[i];
    const b = new Uint8Array(a.buffer);
    let s = '';
    for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192));
    return btoa(s);
}
function decodeGhost(str) {
    try {
        const s = atob(str);
        const b = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
        return new Int16Array(b.buffer, 0, Math.floor(b.length / 2));
    } catch (e) { return null; }
}
function saveGhost(trackId, carId, rec) { storageSet(ghostKey(trackId, carId), encodeGhost(rec)); }
function loadGhost(trackId, carId) {
    const s = storageGet(ghostKey(trackId, carId));
    return s ? decodeGhost(s) : null;
}

// ---------- medaile a odemykání ----------

function leaderboardRows(trackId, carFilter) {
    const rows = [];

        const p = store.profiles[pid];
        for (const k in p.bests) {
            const [tid, cid] = k.split('|');

// ---------------- geometrie pásů ----------------

    ground.receiveShadow = true; g.add(ground);

    }
    // věž řízení závodu nad boxy
    { const p = placeAt(T, T.pitBoxS, sd * (wo + 16)); const tw = new THREE.Mesh(new THREE.BoxGeometry(24, 9, 8), new THREE.MeshStandardMaterial({ color: 0x9aa3b5, roughness: 0.6 })); tw.position.set(p.x, p.y + 4.5, p.z); tw.rotation.y = p.a; tw.castShadow = shadowOn; g.add(tw); }

    // --- tribuny s diváky na protější straně startovní rovinky
    const standMat = new THREE.MeshStandardMaterial({ color: 0x8e93a3, roughness: 0.8 });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0xd8dae2, roughness: 0.5 });
    const specCount = dens === 0 ? 0 : (dens === 1 ? 220 : 600);
    const specMesh = specCount ? new THREE.InstancedMesh(new THREE.BoxGeometry(0.55, 0.95, 0.45), new THREE.MeshLambertMaterial({ color: 0xffffff }), specCount) : null;
    let specN = 0;
    const standSpans = [[-60, 0], [10, 70], [90, 150]];
    standSpans.forEach(([s0, s1]) => {
        const sc = (s0 + s1) / 2, len = s1 - s0;
        for (let step = 0; step < 4; step++) {
            const p = placeAt(T, sc, -sd * (wo + 9 + step * 3.2));
            const h = 1.6 + step * 1.6;
            const bx = new THREE.Mesh(new THREE.BoxGeometry(3.2, h, len), standMat);
            bx.position.set(p.x, p.y + h / 2, p.z); bx.rotation.y = p.a; bx.castShadow = shadowOn; bx.receiveShadow = true; g.add(bx);
            if (specMesh) {
                for (let k = 0; k < len / 1.3 && specN < specCount; k++) {
                    if (rng() < 0.18) continue;
                    const sp = placeAt(T, s0 + 0.8 + k * 1.3, -sd * (wo + 9 + step * 3.2));
                    dummy.position.set(sp.x, sp.y + h + 0.48, sp.z); dummy.rotation.set(0, sp.a, 0); dummy.scale.set(1, 0.9 + rng() * 0.25, 1); dummy.updateMatrix();
                    specMesh.setMatrixAt(specN, dummy.matrix);
                    col.setHSL(rng(), 0.55 + rng() * 0.3, 0.45 + rng() * 0.2); specMesh.setColorAt(specN, col);
                    specN++;
                }
            }
        }
        const pr = placeAt(T, sc, -sd * (wo + 15));
        const roof = new THREE.Mesh(new THREE.BoxGeometry(14, 0.3, len + 2), roofMat);
        roof.position.set(pr.x, pr.y + 9.6, pr.z); roof.rotation.y = pr.a; roof.castShadow = shadowOn; g.add(roof);
        [-0.45, 0.45].forEach(f => { const pp = placeAt(T, sc + f * len, -sd * (wo + 21)); const post = new THREE.Mesh(new THREE.BoxGeometry(0.5, 9.6, 0.5), standMat); post.position.set(pp.x, pp.y + 4.8, pp.z); g.add(post); });
    });
    if (specMesh) { specMesh.count = specN; specMesh.instanceMatrix.needsUpdate = true; if (specMesh.instanceColor) specMesh.instanceColor.needsUpdate = true; g.add(specMesh); }

    // --- stromy
    const treeCount = dens === 0 ? 40 : (dens === 1 ? 260 : 620);
    const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.3, 0.45, 2.6, 6), new THREE.MeshLambertMaterial({ color: 0x6b4a2b }), treeCount);
    const crown = new THREE.InstancedMesh(new THREE.ConeGeometry(2.4, 6.5, 7), new THREE.MeshLambertMaterial({ color: 0xffffff }), treeCount);
    let tn = 0, tries = 0;
    while (tn < treeCount && tries < treeCount * 12) {
        tries++;
        const i = Math.floor(rng() * T.N), side = rng() < 0.5 ? -1 : 1;
        const off = side * (wo + 8 + Math.pow(rng(), 1.8) * 130);
        const x = T.x[i] + T.nx[i] * off, z = T.z[i] + T.nz[i] * off;
        if (distToTrack(T, x, z) < wo + 7) continue;
        const sc = 0.8 + rng() * 0.9;
        dummy.rotation.set(0, rng() * 6, 0); dummy.scale.set(sc, sc, sc);
        dummy.position.set(x, 1.3 * sc, z); dummy.updateMatrix(); trunk.setMatrixAt(tn, dummy.matrix);
        dummy.position.set(x, (2.6 + 3.2) * sc, z); dummy.updateMatrix(); crown.setMatrixAt(tn, dummy.matrix);
        col.setHSL(0.30 + rng() * 0.06, 0.55, 0.20 + rng() * 0.12); crown.setColorAt(tn, col);
        tn++;
    }
    trunk.count = crown.count = tn;
    trunk.instanceMatrix.needsUpdate = crown.instanceMatrix.needsUpdate = true; if (crown.instanceColor) crown.instanceColor.needsUpdate = true;
    trunk.castShadow = crown.castShadow = false; g.add(trunk); g.add(crown);

    // --- budovy v dálce
    const bCount = dens === 0 ? 4 : (dens === 1 ? 14 : 30);
    const bld = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0xffffff }), bCount);
    let bn = 0; tries = 0;
    while (bn < bCount && tries < 400) {
        tries++;
        const i = Math.floor(rng() * T.N), side = rng() < 0.5 ? -1 : 1;
        const off = side * (wo + 70 + rng() * 170);
        const x = T.x[i] + T.nx[i] * off, z = T.z[i] + T.nz[i] * off;
        if (distToTrack(T, x, z) < 65) continue;
        const w = 14 + rng() * 26, d = 14 + rng() * 26, h = 6 + rng() * 22;
        dummy.rotation.set(0, rng() * 3, 0); dummy.scale.set(w, h, d); dummy.position.set(x, h / 2, z); dummy.updateMatrix();
        bld.setMatrixAt(bn, dummy.matrix); col.setHSL(0.08 + rng() * 0.1, 0.1 + rng() * 0.2, 0.55 + rng() * 0.25); bld.setColorAt(bn, col); bn++;
    }
    bld.count = bn; bld.instanceMatrix.needsUpdate = true; if (bld.instanceColor) bld.instanceColor.needsUpdate = true; g.add(bld);

    // --- pneumatiky u vnějších stěn rychlých i pomalých zatáček
    if (dens > 0) {
        const tire = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.5, 0.5, 0.4, 12), new THREE.MeshLambertMaterial({ color: 0xffffff }), 1800);
        let tc = 0;
        for (let i = 0; i < T.N && tc < 1790; i += 3) {
            const k = T.kappa[i];
            if (Math.abs(k) < 1 / 220 || T.pitW[i] > 0.05) continue;
            const outer = -Math.sign(k);   // vnější strana zatáčky
            const p = placeAt(T, i * T.ds, outer * (T.wallIn - 0.7));
            for (let h = 0; h < 3; h++) {
                dummy.position.set(p.x, p.y + 0.2 + h * 0.4, p.z); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix();
                tire.setMatrixAt(tc, dummy.matrix);
                if ((Math.floor(i / 3)) % 2 === 0) col.setHex(h === 1 ? 0xf2f2f2 : 0x161616); else col.setHex(h === 1 ? 0xd62828 : 0x161616);
                tire.setColorAt(tc, col); tc++;
            }
        }
        tire.count = tc; tire.instanceMatrix.needsUpdate = true; if (tire.instanceColor) tire.instanceColor.needsUpdate = true; g.add(tire);
    }

    // --- lampy podél tratě (svítí v noci)
    if (Q.lamps && dens > 0) {
        const lampStep = dens === 1 ? 90 : 55;
        const cnt = Math.floor(T.L / lampStep);
        const poles = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.15, 0.2, 10, 6), new THREE.MeshLambertMaterial({ color: 0x555a66 }), cnt);
        const heads = new THREE.InstancedMesh(new THREE.BoxGeometry(1.8, 0.35, 0.7), lampMat, cnt);
        for (let k = 0; k < cnt; k++) {
            const side = (k % 2 === 0 ? 1 : -1);
            const p = placeAt(T, k * lampStep, side * (wo + 2.2));
            dummy.rotation.set(0, p.a, 0); dummy.scale.set(1, 1, 1);
            dummy.position.set(p.x, p.y + 5, p.z); dummy.updateMatrix(); poles.setMatrixAt(k, dummy.matrix);
            const q = placeAt(T, k * lampStep, side * (wo + 0.9));
            dummy.position.set(q.x, q.y + 10, q.z); dummy.updateMatrix(); heads.setMatrixAt(k, dummy.matrix);
        }
        poles.instanceMatrix.needsUpdate = heads.instanceMatrix.needsUpdate = true; g.add(poles); g.add(heads);
    }

    // --- mraky
    const cl = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 8, 6), cloudMat, dens === 0 ? 8 : 22);
    for (let k = 0; k < cl.count; k++) {
        const a = rng() * 6.28, r = 300 + rng() * 700;
        dummy.position.set((T.bounds.minX + T.bounds.maxX) / 2 + Math.cos(a) * r, 160 + rng() * 120, (T.bounds.minZ + T.bounds.maxZ) / 2 + Math.sin(a) * r);
        dummy.rotation.set(0, 0, 0); dummy.scale.set(60 + rng() * 80, 12 + rng() * 10, 40 + rng() * 50); dummy.updateMatrix(); cl.setMatrixAt(k, dummy.matrix);
    }
    cl.instanceMatrix.needsUpdate = true; g.add(cl);

    g.traverse(o => { if (o.isInstancedMesh) o.frustumCulled = false; });
    scene.add(g);
    sceneryGroup = g;
}

// ---------------- model auta ----------------
function buildCarModel(def, look) {
    const g = new THREE.Group();
    const body = new THREE.MeshStandardMaterial({ color: look.body, metalness: 0.6, roughness: 0.25 });
    const stripe = new THREE.MeshStandardMaterial({ color: look.stripe, roughness: 0.4 });
    const cabinM = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
    const carbon = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
    const tireM = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.8 });
    const rimM = new THREE.MeshStandardMaterial({ color: look.rims, metalness: 0.8, roughness: 0.2 });
    const { len, wid, hgt, wheelR, tire } = def.dims;
    const yTop = 0.6 + hgt / 2;

    const chassis = new THREE.Mesh(new THREE.BoxGeometry(wid, hgt, len), body); chassis.position.y = 0.6; chassis.castShadow = true; g.add(chassis);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(def.cabin.wid, 0.55, def.cabin.len), cabinM);
    cabin.position.set(0, yTop + 0.225, def.cabin.z); cabin.castShadow = true; g.add(cabin);
    const cabTop = yTop + 0.5;

    const sm = (w, h, d, x, y, z, m) => { const q = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); q.position.set(x, y, z); g.add(q); return q; };
    // polepy
    const pat = look.pattern;
    if (pat === 'center') sm(0.35, 0.02, len * 0.98, 0, yTop + 0.012, 0, stripe);
    else if (pat === 'double') { sm(0.16, 0.02, len * 0.98, -0.28, yTop + 0.012, 0, stripe); sm(0.16, 0.02, len * 0.98, 0.28, yTop + 0.012, 0, stripe); }
    else if (pat === 'side') [-1, 1].forEach(s => sm(0.03, 0.14, len * 0.8, s * (wid / 2 + 0.012), 0.55, 0, stripe));
    else if (pat === 'checker') {
        const ck = new THREE.Mesh(new THREE.PlaneGeometry(wid * 0.7, 1.2), new THREE.MeshBasicMaterial({ map: SHARED.checker || texChecker() }));
        ck.rotation.x = -Math.PI / 2; ck.position.set(0, yTop + 0.015, -len * 0.28); g.add(ck);
    }
    // splitter
    if (look.splitter) sm(wid + 0.1, 0.14, 0.6, 0, 0.35, -(len / 2 - 0.1), carbon);
    // křídlo
    const wing = look.wing;
    if (wing === 'high' || wing === 'big') {
        const big = wing === 'big', bw = big ? wid + 0.25 : wid, by = big ? 1.62 : 1.45, bz = len / 2 - 0.2;
        sm(bw, 0.08, big ? 0.6 : 0.45, 0, by, bz, carbon);
        const sh = by - yTop;
        [-1, 1].forEach(s => sm(0.08, sh, 0.2, s * (wid / 2 - 0.4), yTop + sh / 2, bz, carbon));
    } else if (wing === 'lip') sm(wid - 0.1, 0.07, 0.3, 0, yTop + 0.08, len / 2 - 0.15, carbon);
    // střešní vzduchovod
    if (look.scoop) sm(0.5, 0.25, 0.7, 0, cabTop + 0.12, def.cabin.z, carbon);

    // světla
    const headM = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const tailM = new THREE.MeshBasicMaterial({ color: 0x660000 });
    [-1, 1].forEach(s => {
        sm(0.4, 0.15, 0.1, s * (wid / 2 - 0.35), 0.7, -(len / 2 + 0.01), headM);
        sm(0.5, 0.15, 0.1, s * (wid / 2 - 0.4), 0.75, len / 2 + 0.01, tailM);
    });
    // čísla
    const nt = texNumber(look.num);
    const nm = new THREE.MeshBasicMaterial({ map: nt, transparent: true, alphaTest: 0.4 });
    [-1, 1].forEach(s => { const p = new THREE.Mesh(new THREE.PlaneGeometry(0.85, 0.85), nm); p.position.set(s * (wid / 2 + 0.015), 0.62, 0.2); p.rotation.y = s * Math.PI / 2; g.add(p); });
    const rp = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9), nm); rp.rotation.x = -Math.PI / 2; rp.position.set(0, cabTop + 0.025, def.cabin.z); g.add(rp);

    // kola
    const wheels = [], wx = wid / 2 + 0.02, wz = def.L / 2;
    [[-wx, -wz], [wx, -wz], [-wx, wz], [wx, wz]].forEach(([x, z]) => {
        const wg = new THREE.Group();
        const t = new THREE.Mesh(new THREE.CylinderGeometry(wheelR, wheelR, tire, 20), tireM); t.rotation.z = Math.PI / 2;
        const r = new THREE.Mesh(new THREE.CylinderGeometry(wheelR * 0.62, wheelR * 0.62, tire + 0.01, 12), rimM); r.rotation.z = Math.PI / 2;
        wg.add(t, r); wg.position.set(x, wheelR, z); g.add(wg); wheels.push(wg);
    });
    return { group: g, wheels, tailM, headM, def };
}

function makeGhost(model) {
    model.group.traverse(o => {
        if (o.material) {
            o.material.transparent = true; o.material.opacity = 0.34; o.material.depthWrite = false;
            if (o.material.emissive) o.material.emissive.setHex(0x0a4a66);
            o.castShadow = false;
        }
    });
    return model;
}
